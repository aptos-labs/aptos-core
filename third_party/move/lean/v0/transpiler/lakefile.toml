# Move-to-Verex transpiler: decodes XAST (the compiler-v2 typed AST exported
# by `aptos move exchange --format ast`) and prints textual Verex Move.  The
# library depends on Lean core only; `move` is required so the elaboration
# gate in the test suite can build generated modules against `Move`.
name = "transpiler"
defaultTargets = ["Transpiler", "transpile"]
testDriver = "TranspilerTests"

[[require]]
name = "move"
path = "../move"

[[require]]
name = "verex-move"
path = "../../verex-move"

[[lean_lib]]
name = "Transpiler"

[[lean_exe]]
name = "transpile"
root = "Main"

# Decoder and printer baselines, and the generated modules built against `Move`.
[[lean_lib]]
name = "TranspilerTests"
roots = ["Transpiler.Tests"]
