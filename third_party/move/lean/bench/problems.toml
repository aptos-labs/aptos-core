#
# The problems of the verification benchmark (designs/verification-benchmarks.md),
# read from the tree at the benchmarked commit. Paths are relative to the
# repository root. A problem is `move` (modules of an in-tree package),
# `lean` (a LeanerLang file), or `rust` (a Rust file with its specification).
# `inputs` lists further paths whose change changes the problem; `dev`
# compiles a Move package in dev mode (its `[dev-addresses]`); `repeat`
# runs a small problem several times and keeps the median; `timeout` is in
# seconds (20 minutes by default).

# ## Move standard library

[[problem]]
name = "option"
kind = "move"
package = "aptos-move/framework/move-stdlib"
modules = ["std::option"]

[[problem]]
name = "vector"
kind = "move"
package = "aptos-move/framework/move-stdlib"
modules = ["std::vector"]

[[problem]]
name = "string"
kind = "move"
package = "aptos-move/framework/move-stdlib"
modules = ["std::string"]
repeat = 3

[[problem]]
