name = "leaner-rust"
defaultTargets = ["LeanerRust", "leaner-rust"]
testDriver = "LeanerRustTests"

[[require]]
name = "leaner-ir"
path = "../leaner-ir"

[[lean_lib]]
name = "LeanerRust"

[[lean_exe]]
name = "leaner-rust"
root = "Main"
# Elaborating the rendering runs imported elaborators, which may reach the
# interpreter.
supportInterpreter = true

[[lean_lib]]
name = "LeanerRustTests"
roots = ["LeanerRust.Tests.Profile", "LeanerRust.Tests.Driver", "LeanerRust.Tests.LeanerLang", "LeanerRust.Tests.RegistryConsumer", "LeanerRust.Tests.Source", "LeanerRust.Tests.SourcePredicates"]
