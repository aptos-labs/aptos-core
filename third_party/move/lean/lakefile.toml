name = "Move"
defaultTargets = ["MoveModel", "Move", "MoveExamples"]
testDriver = "moveTests"

[[lean_lib]]
name = "MoveModel"

# Lean-authored smart contracts and the Lean-to-Move frontend.  This is a
# separate namespace from `MoveModel`, which models the target IR and prover.
[[lean_lib]]
name = "Move"

# Golden source and end-to-end Leaner-to-Move-IR regression checks.
[[lean_lib]]
name = "MoveExamples"
roots = ["Move.Examples.AccountCompiled"]

# Frontend-embedding examples (`masm%`/`move%`): elaborating them runs the
# Aptos CLI (`aptos move exchange`), hence not a default target.  Rooted
# inside the library tree at `MoveModel/Examples.lean`.
[[lean_lib]]
name = "Examples"
roots = ["MoveModel.Examples"]

# Interpreter unit tests (`#test`/`#guard`-based): elaborating them runs
# the Aptos CLI (`aptos move exchange`), hence not a default target.
[[lean_lib]]
name = "Tests"

# Lake schedules independent Lean compiler processes eagerly.  The test suite
# imports enough of the Lean metaprogramming stack that an unconstrained clean
# build can exhaust host file descriptors.  The driver gives the nested build
# a small, deterministic scheduler limit.
[[lean_exe]]
name = "moveTests"
root = "TestDriver"
