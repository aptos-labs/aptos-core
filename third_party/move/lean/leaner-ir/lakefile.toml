name = "leaner-ir"
defaultTargets = ["LeanerIR", "LeanerLang"]
testDriver = "LeanerIRTests"

[[lean_lib]]
name = "LeanerIR"
# Equation lemmas of the denotation (`Term.denote`, some seventy cases) are
# realized under the package default budget, which the file cannot raise.
leanOptions = { maxHeartbeats = 400000 }

[[lean_lib]]
name = "LeanerLang"
# The source-verification driver is a tool, not part of the language import.
roots = ["LeanerLang", "LeanerLang.SourceVerify"]

[[lean_lib]]
name = "LeanerIRTests"
roots = ["LeanerIR.Tests.Validation", "LeanerIR.Tests.Json", "LeanerIR.Tests.Interpreter", "LeanerIR.Tests.Primitives", "LeanerIR.Tests.References", "LeanerIR.Tests.Closures", "LeanerIR.Tests.Globals", "LeanerIR.Tests.Data", "LeanerIR.Tests.NominalPlaces", "LeanerIR.Tests.Generics", "LeanerIR.Tests.Abilities", "LeanerIR.Tests.Control", "LeanerIR.Tests.Declarations", "LeanerIR.Tests.Intrinsics", "LeanerIR.Tests.Representation", "LeanerIR.Tests.StaticTyping", "LeanerIR.Tests.ReturnedStorage", "LeanerIR.Tests.TableLoans", "LeanerIR.Tests.TableMemory", "LeanerIR.Tests.TableOperations", "LeanerIR.Tests.TableFootprint", "LeanerIR.Tests.StateView", "LeanerIR.Tests.SnapshotValue", "LeanerIR.Tests.StoredValueInvariants", "LeanerLang.Tests.Frontend", "LeanerLang.Tests.ArithmeticContext", "LeanerLang.Tests.LoopUnroll", "LeanerLang.Tests.LiteralOptionalReads", "LeanerLang.Tests.ContinuationCleanup", "LeanerLang.Tests.CallRangeResults", "LeanerLang.Tests.StateLabelDecoding",
  "LeanerLang.Tests.StateLabelWitnesses", "LeanerLang.Tests.StateLabelCallObservations", "LeanerLang.Tests.StateLabelBooleanObservations", "LeanerLang.Tests.StateLabelMemoryEquality", "LeanerLang.Tests.StoredTableInvariantErrors", "LeanerLang.Tests.InvocationTypes", "LeanerLang.Tests.LooseFrame", "LeanerLang.Tests.Reserved", "LeanerLang.Tests.AddressAliases", "LeanerLang.Tests.Link", "LeanerLang.Tests.Behavior", "LeanerLang.Tests.SpecTypes", "LeanerLang.Tests.CompositionPerformance", "LeanerLang.Tests.DenotePerformance", "LeanerLang.Tests.DenoteCache", "LeanerLang.Tests.DenoteCacheImport"]
