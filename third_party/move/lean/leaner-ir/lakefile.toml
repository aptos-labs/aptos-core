name = "leaner-ir"
defaultTargets = ["LeanerIR", "LeanerLang"]
testDriver = "LeanerIRTests"

[[lean_lib]]
name = "LeanerIR"
# Equation lemmas of the denotation (`Term.denote`, some seventy cases) are
# realized under the package default budget, which the file cannot raise.
leanOptions = { maxHeartbeats = 400000 }

[[lean_lib]]
name = "LeanerLang"

[[lean_lib]]
name = "LeanerIRTests"
roots = ["LeanerIR.Tests.Validation", "LeanerIR.Tests.Json", "LeanerIR.Tests.Interpreter", "LeanerIR.Tests.Primitives", "LeanerIR.Tests.References", "LeanerIR.Tests.Closures", "LeanerIR.Tests.Globals", "LeanerIR.Tests.Data", "LeanerIR.Tests.NominalPlaces", "LeanerIR.Tests.Generics", "LeanerIR.Tests.Abilities", "LeanerIR.Tests.Control", "LeanerIR.Tests.Declarations", "LeanerIR.Tests.Intrinsics", "LeanerIR.Tests.Representation", "LeanerLang.Tests.Frontend", "LeanerLang.Tests.InvocationTypes", "LeanerLang.Tests.LooseFrame", "LeanerLang.Tests.SpecTypes", "LeanerLang.Tests.CompositionPerformance", "LeanerLang.Tests.DenotePerformance", "LeanerLang.Tests.DenoteCache", "LeanerLang.Tests.DenoteCacheImport"]
