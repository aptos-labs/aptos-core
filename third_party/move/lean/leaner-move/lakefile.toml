name = "leaner-move"
defaultTargets = ["LeanerMove", "leaner-move"]
testDriver = "Tests"

[[require]]
name = "leaner-ir"
path = "../leaner-ir"

[[lean_lib]]
name = "LeanerMove"

[[lean_exe]]
name = "leaner-move"
root = "Main"
# Elaborating the rendering runs imported elaborators, which may reach the
# interpreter.
supportInterpreter = true

[[lean_lib]]
name = "Tests"
roots = ["Tests.Profile", "Tests.Intrinsics", "Tests.Xir", "Tests.Xast", "Tests.BitVectorConversion"]
