name = "verex-ir"
defaultTargets = ["VerexIR", "VerexSL"]
testDriver = "VerexIRTests"

[[lean_lib]]
name = "VerexIR"
# Constructor equations of the denotation are kernel-checked under the
# package default budget, which the file cannot raise.
leanOptions = { maxHeartbeats = 800000 }

[[lean_lib]]
name = "VerexSL"
# The source-verification driver is a tool, not part of the language import.
roots = ["VerexSL", "VerexSL.SourceVerify"]

