# Leaner Move: the source language, its source contracts and `verify` proof
# engine, and lowering to XIR.
name = "move"
defaultTargets = ["Move"]
testDriver = "moveTests"

[[require]]
name = "move-model"
path = "../move-model"

[[lean_lib]]
name = "Move"

# Source-verification and compiler-lowering regressions, in this library's own
# namespace.
[[lean_lib]]
name = "MoveTests"
roots = ["Move.Tests"]

# See the note in the move-model package: the driver bounds the nested build's
# scheduler so a clean test build cannot exhaust host file descriptors.
[[lean_exe]]
name = "moveTests"
root = "TestDriver"
