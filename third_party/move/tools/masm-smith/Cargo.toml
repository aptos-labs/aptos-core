[package]
name = "masm-smith"
version = "0.1.0"
authors = ["Aptos Labs"]
description = "Guided generative fuzzer that emits .masm transactional tests for the Move VM and bytecode verifier."
repository = "https://github.com/aptos-labs/aptos-core"
homepage = "https://aptosfoundation.org/"
license = "Apache-2.0"
publish = false
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
arbitrary = { workspace = true, features = ["derive"] }
bcs = { workspace = true }
clap = { workspace = true, features = ["derive"] }
either = { workspace = true }
hex = { workspace = true }
move-asm = { workspace = true }
move-binary-format = { workspace = true }
move-bytecode-verifier = { workspace = true }
move-core-types = { workspace = true }
move-transactional-test-runner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shared-dsa = { workspace = true }

[dev-dependencies]
move-transactional-test-matrix = { workspace = true }
tempfile = { workspace = true }

[lib]
doctest = false

[[bin]]
name = "masm-smith"
path = "src/bin/masm-smith.rs"
