[package]
name = "masm-smith-fuzz"
version = "0.0.0"
publish = false
edition = { workspace = true }

[package.metadata]
cargo-fuzz = true

# Build with `RUSTFLAGS="--cfg tokio_unstable" cargo fuzz build`: cargo-fuzz's RUSTFLAGS
# replace the workspace's `build.rustflags`, which set `tokio_unstable`.

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
either = { workspace = true }
libfuzzer-sys = "0.4.9"
masm-smith = { workspace = true }
mono-move-testsuite = { workspace = true }
move-asm = { workspace = true }
move-binary-format = { workspace = true }
move-bytecode-verifier = { workspace = true }
move-core-types = { workspace = true }
move-transactional-test-matrix = { workspace = true }
move-transactional-test-runner = { workspace = true }
move-vm-runtime = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false

[[bin]]
name = "assemble_only"
path = "fuzz_targets/assemble_only.rs"
test = false
doc = false

[[bin]]
name = "verify_prod"
path = "fuzz_targets/verify_prod.rs"
test = false
doc = false

[[bin]]
name = "run_vm_prod"
path = "fuzz_targets/run_vm_prod.rs"
test = false
doc = false

[[bin]]
name = "run_vm_mutate"
path = "fuzz_targets/run_vm_mutate.rs"
test = false
doc = false

[[bin]]
name = "run_vm_diff"
path = "fuzz_targets/run_vm_diff.rs"
test = false
doc = false
