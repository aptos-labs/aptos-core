[package]
name = "mono-move-unit-test-backend"
description = "Runs Move unit tests on MonoMove"
version = "0.1.0"

# Workspace inherited keys
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[dependencies]
anyhow = { workspace = true }
aptos-types = { workspace = true }
bytes = { workspace = true }
legacy-move-compiler = { workspace = true }
mono-move-core = { workspace = true }
mono-move-global-context = { workspace = true }
mono-move-loader = { workspace = true }
mono-move-natives = { workspace = true }
mono-move-output = { workspace = true }
mono-move-runtime = { workspace = true }
move-binary-format = { workspace = true }
move-bytecode-verifier = { workspace = true }
move-core-types = { workspace = true }
move-unit-test = { workspace = true }
shared-dsa = { workspace = true }
thiserror = { workspace = true }

[features]
# Registers the test-only natives (signer creation, key generation, event
# queries), as `aptos-vm/testing` does for V1.
testing = ["mono-move-natives/testing"]
