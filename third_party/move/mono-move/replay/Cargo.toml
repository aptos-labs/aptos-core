[package]
name = "mono-move-replay"
description = "Compares the MonoMove-backed transaction executor (V2) against the legacy AptosVM (V1) on real chain transactions: captures them into a corpus, replays both VMs on the same state, and reports a verdict per transaction."
version = "0.1.0"

# Workspace inherited keys
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "mono-move-replay"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
aptos-comparison-testing-dump-format = { workspace = true }
