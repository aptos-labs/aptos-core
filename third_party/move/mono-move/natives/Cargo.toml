[package]
name = "mono-move-natives"
version = "0.1.0"

# Workspace inherited keys
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[dependencies]
aptos-crypto = { workspace = true }
aptos-types = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true, optional = true }
bcs = { workspace = true }
blake2-rfc = { workspace = true }
bulletproofs = { workspace = true }
byteorder = { workspace = true }
curve25519-dalek = { package = "curve25519-dalek-ng", version = "4" }
hex = { workspace = true }
libsecp256k1 = { workspace = true }
merlin = { workspace = true }
mono-move-core = { workspace = true }
move-core-types = { workspace = true }
num-traits = { workspace = true }
once_cell = { workspace = true }
rand_core = { workspace = true, optional = true }
ripemd = { workspace = true }
sha2 = { workspace = true }
# `crypto_algebra`'s hash-to-curve needs sha2 0.10, while the rest of this crate
# is on 0.9. Both are linked; using the wrong one silently changes the digest.
sha2_0_10_6 = { workspace = true }
sha3 = { workspace = true }
siphasher = { workspace = true }
tiny-keccak = { workspace = true }

[features]
# Enables the test-only crypto natives (key generation, signing, PoP creation,
# and `crypto_algebra::rand_insecure_internal`).
testing = ["aptos-crypto/fuzzing", "ark-std", "rand_core"]
