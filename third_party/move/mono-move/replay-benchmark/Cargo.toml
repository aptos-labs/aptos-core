[package]
name = "mono-move-replay-benchmark"
description = "Replays a transaction captured from a real network on both the legacy AptosVM (V1) and the MonoMove-backed transaction executor (V2), comparing execution time and outputs."
version = "0.1.0"

# Workspace inherited keys
authors = { workspace = true }
