[package]
name = "aptos-tinfoil-sigstore"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Offline Sigstore verification for Tinfoil v3 attestation"

[dependencies]
base64 = "0.23"
const-oid = { version = "0.10", features = ["db"] }
der = { version = "0.8", features = ["derive"] }
digest = "0.10"
ed25519-dalek = "3"
hex = "0.4"
p256 = "0.13.2"
pem = "4"
regex = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tls_codec = { version = "0.4", features = ["derive"] }
x509-cert = { version = "0.3", features = ["sct"] }

[dev-dependencies]
hex-literal = "1"
