[tool.poetry]
name = "aptos-cli-e2e-tests"
package-mode = false
version = "0.1.0"
description = "Aptos CLI E2E tests"
authors = ["Aptos Labs <opensource@aptoslabs.com>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.12,<4"
aptos-sdk = "^0.12.3"
requests = "^2.33.0"

[tool.poetry.dev-dependencies]
black = "^26.10.1"
isort = "^5.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
