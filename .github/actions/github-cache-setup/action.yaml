name: GitHub cache setup
description: Enable caching only with GitHub's authenticated cache service
runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        CACHE_POLICY_PATH: ${{ github.action_path }}/../../scripts/cache-policy.cjs
      with:
        script: |
          const { isGitHubCacheUrl, canWriteSharedCache } = require(process.env.CACHE_POLICY_PATH);
          const url = process.env.ACTIONS_RESULTS_URL;
          const enabled = isGitHubCacheUrl(url) && Boolean(process.env.ACTIONS_RUNTIME_TOKEN);
          core.exportVariable('CI_CACHE_ENABLED', String(enabled));
          core.exportVariable('CI_CACHE_WRITE', String(enabled && canWriteSharedCache(process.env.GITHUB_EVENT_NAME, process.env.GITHUB_REF)));
          if (!enabled) {
            core.warning('Native GitHub cache credentials unavailable: running without a cache. Shared cache proxies are not trusted.');
            return;
          }
          core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
          core.exportVariable('ACTIONS_RESULTS_URL', url);
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
          core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');
