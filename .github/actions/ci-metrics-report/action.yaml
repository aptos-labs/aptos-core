name: CI measurements
description: Preserve phase timings, compiler-cache statistics and runner configuration
inputs:
  name:
    description: Unique measurement name within this workflow run
    required: true
runs:
  using: composite
  steps:
    - name: Collect measurements
      shell: bash
      run: |
        mkdir -p ci-metrics
        if [[ "${RUSTC_WRAPPER:-}" == sccache ]] && command -v sccache >/dev/null; then
          sccache --show-stats --stats-format json > ci-metrics/sccache.json || true
        fi
        if [[ -r "${SCCACHE_ERROR_LOG:-}" ]]; then
          python3 .github/scripts/ci_metrics.py cache-errors "$SCCACHE_ERROR_LOG" > ci-metrics/cache-errors.json
        fi
        {
          echo "Compiler wrapper: ${RUSTC_WRAPPER:-none}"
          echo "Cache mode: ${SCCACHE_GHA_RW_MODE:-disabled}"
          echo "CARGO_INCREMENTAL: ${CARGO_INCREMENTAL:-unset}"
          echo "CARGO_TERM_COLOR: ${CARGO_TERM_COLOR:-unset}"
          git rev-parse HEAD
          rustc -Vv
          cargo nextest --version
          nproc
          free -b
          for counter in /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory/memory.max_usage_in_bytes; do
            if [[ -r "$counter" ]]; then
              echo "Cgroup peak bytes ($counter): $(<"$counter")"
            fi
          done
          df -B1 .
        } > ci-metrics/runner.txt
    - uses: actions/upload-artifact@v4
      with:
        name: ci-metrics-${{ inputs.name }}-${{ github.run_attempt }}
        path: ci-metrics/
        retention-days: 7
        if-no-files-found: error
