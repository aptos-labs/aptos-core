name: Test Target Determinator
description: Runs the test target determinator
inputs:
  GIT_CREDENTIALS:
    description: "Optional credentials to pass to git. Useful if you need to pull private repos for dependencies"
    required: false
  BASE_REF:
    description: "Comparison branch or commit (merge base with HEAD)"
    default: origin/main
  working_directory:
    description: "Directory that contains the checked-out source to analyze"
    required: false
    default: "."
outputs:
  run_execution_performance_test:
    description: "Returns true if the execution performance test should be run"
    value: ${{ steps.execution_performance_determinator.outputs.run_execution_performance_test }}
  run_framework_upgrade_test:
    description: "Returns true if the framework upgrade test should be run"
    value: ${{ steps.framework_upgrade_determinator.outputs.run_framework_upgrade_test }}

runs:
  using: composite
  steps:
    # Do not use rust-setup here: it runs dev_setup with test-only dependencies
    # (including NodeSource, Move Prover, PostgreSQL, and protoc plugins).
    # dsherret/rust-toolchain-file reads the toolchain file only from the
    # workspace root. Install the toolchain that the source directory's file
    # selects; an argument-less `rustup toolchain install` needs rustup 1.28+.
    - name: Set up Rust toolchain
      working-directory: ${{ inputs.working_directory }}
      run: |
        if [[ ! -f rust-toolchain.toml && ! -f rust-toolchain ]]; then
          echo "No rust-toolchain or rust-toolchain.toml file found in $PWD." >&2
          exit 1
        fi
        rustup show active-toolchain || rustup toolchain install
        rustc --version --verbose
        if [[ -z "${CARGO_INCREMENTAL+set}" ]]; then
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        fi
      shell: bash

    # Output the changed files
    - name: Set up Git credentials and output the changed files
      working-directory: ${{ inputs.working_directory }}
      env:
        TARGET_DETERMINATOR_GIT_CREDENTIALS: ${{ inputs.GIT_CREDENTIALS }}
        TEST_BASE_REF: ${{ inputs.BASE_REF }}
      run: |
        if [[ -n "$TARGET_DETERMINATOR_GIT_CREDENTIALS" ]]; then
          git config --global credential.helper store
          printf '%s\n' "$TARGET_DETERMINATOR_GIT_CREDENTIALS" > ~/.git-credentials
        fi
        cargo x --base "$TEST_BASE_REF" changed-files -vv
      shell: bash

    # Output the affected packages
    - name: Output the affected packages
      working-directory: ${{ inputs.working_directory }}
      run: cargo x --base "$TEST_BASE_REF" affected-packages -vv
      shell: bash
      env:
        TEST_BASE_REF: ${{ inputs.BASE_REF }}

    # Run the execution performance test determinator
    - name: Run the execution performance test determinator
      id: execution_performance_determinator
      working-directory: ${{ inputs.working_directory }}
      run: |
          export RESULT=$(cargo x --base "$TEST_BASE_REF" targeted-execution-performance-tests | awk -F'Execution performance test required: ' '{print $2}')
          echo "Execution performance test required: $RESULT"
          echo "run_execution_performance_test=$RESULT" >> $GITHUB_OUTPUT
      shell: bash
      env:
        TEST_BASE_REF: ${{ inputs.BASE_REF }}

    # Run the framework upgrade test determinator
    - name: Run the framework upgrade test determinator
      id: framework_upgrade_determinator
      working-directory: ${{ inputs.working_directory }}
      run: |
        export RESULT=$(cargo x --base "$TEST_BASE_REF" targeted-framework-upgrade-tests | awk -F'Framework upgrade test required: ' '{print $2}')
        echo "Framework upgrade test required: $RESULT"
        echo "run_framework_upgrade_test=$RESULT" >> $GITHUB_OUTPUT
      shell: bash
      env:
        TEST_BASE_REF: ${{ inputs.BASE_REF }}
