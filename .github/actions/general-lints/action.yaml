name: General Lints
description: Runs all general lints. This includes all linters except rust and docs lints.
inputs:
  GIT_CREDENTIALS:
    description: "Optional credentials to pass to git. Useful if you need to pull private repos for dependencies"
    required: false

runs:
  using: composite
  steps:
    # The source code must be checkout out by the workflow that invokes this action.

    - name: Test nightly failure summaries
      run: python3 -m unittest discover -s .github/actions/nightly-test-summary -p '*_test.py'
      shell: bash

    - name: Test E2E selection workflow integration
      run: python3 -m unittest discover -s .github/actions/e2e-test-determinator -p '*_test.py'
      shell: bash

    # Install shellcheck and run it on the dev_setup.sh script
    - name: Run shell lints
      run: |
        sudo apt-get install shellcheck --assume-yes --no-install-recommends
        shellcheck scripts/dev_setup.sh
      shell: bash

    - name: Validate evaluation publication bundles
      run: |
        cd aptos-move/flow/evaluation/spec-inference
        python3 -W error::ResourceWarning -m unittest tests.test_publication
      shell: bash
