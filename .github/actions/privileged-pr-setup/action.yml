name: Prepare a privileged PR image build
description: Run the trusted-base setup that must finish before PR-controlled code runs

inputs:
  source_repository:
    description: Repository that owns the approved PR commit
    required: true
  source_sha:
    description: Full lowercase SHA of the approved PR commit
    required: true
  pr_number:
    description: Pull request number
    required: true
  profile:
    description: Cargo profile of the images
    required: false
    default: release
  features:
    description: Cargo features of the images
    required: false
    default: ""
  workload_identity_provider:
    description: Google Cloud workload identity provider
    required: true
  service_account:
    description: Google Cloud service account
    required: true
  artifact_repo:
    description: Google Artifact Registry repository for the images
    required: true

outputs:
  custom_image_tag_prefix:
    description: CUSTOM_IMAGE_TAG_PREFIX for docker-bake-rust-all.sh
    value: ${{ steps.tags.outputs.custom_image_tag_prefix }}
  image_tag:
    description: Full tag of the images that docker-bake-rust-all.sh publishes
    value: ${{ steps.tags.outputs.image_tag }}

runs:
  using: composite
  steps:
    - name: Check protected deployment prerequisites
      shell: bash
      env:
        GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.workload_identity_provider }}
        GCP_SERVICE_ACCOUNT_EMAIL: ${{ inputs.service_account }}
        GCP_DOCKER_ARTIFACT_REPO: ${{ inputs.artifact_repo }}
      run: |
        set -euo pipefail
        test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "::error::privileged-pr-ci lacks GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
        test -n "$GCP_SERVICE_ACCOUNT_EMAIL" || { echo "::error::privileged-pr-ci lacks GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
        test -n "$GCP_DOCKER_ARTIFACT_REPO" || { echo "::error::privileged-pr-ci lacks GCP_DOCKER_ARTIFACT_REPO"; exit 1; }

    - name: Check out and verify the exact approved PR revision
      uses: ./trusted-base/.github/actions/checkout-exact-pr-source
      with:
        source_repository: ${{ inputs.source_repository }}
        source_sha: ${{ inputs.source_sha }}

    - name: Set up an isolated protected Docker builder
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      with:
        name: protected-pr-${{ github.run_id }}-${{ github.run_attempt }}
        keep-state: false
        cleanup: true
        cache-binary: false

    - name: Authenticate to Google Cloud from the protected environment
      uses: ./trusted-base/.github/actions/gcp-registry-auth
      with:
        create_credentials_file: false
        access_token_lifetime: 5400
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    # docker-bake-rust-all.sh runs from the PR checkout, so trusted code derives
    # the published tag itself. The prefix rules mirror that script.
    - name: Derive the protected image tag
      id: tags
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        PROFILE: ${{ inputs.profile }}
        FEATURES: ${{ inputs.features }}
      run: |
        set -euo pipefail
        [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::Invalid PR number"; exit 1; }
        [[ "$PROFILE" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::Invalid build profile"; exit 1; }
        [[ "$FEATURES" =~ ^[a-z0-9,-]*$ ]] || { echo "::error::Invalid build features"; exit 1; }
        case "$PROFILE:$FEATURES" in
          performance:) custom_prefix="performance_pr-${PR_NUMBER}" ;;
          release:failpoints) custom_prefix="failpoints_pr-${PR_NUMBER}" ;;
          *) custom_prefix="pr-${PR_NUMBER}" ;;
        esac
        profile_prefix=""
        [[ "$PROFILE" == "release" ]] || profile_prefix="${PROFILE}_"
        feature_prefix=""
        [[ -z "$FEATURES" ]] || feature_prefix="$(printf '%s' "$FEATURES" | sed -e 's/[^a-zA-Z0-9]/_/g')_"
        image_tag="${custom_prefix}_${profile_prefix}${feature_prefix}${SOURCE_SHA}"
        {
          echo "custom_image_tag_prefix=$custom_prefix"
          echo "image_tag=$image_tag"
        } >> "$GITHUB_OUTPUT"
        echo "PR_IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
