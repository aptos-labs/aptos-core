rules:
  - id: pull-request-target-code-checkout
    languages:
      - yaml
    message: >-
      This GitHub Actions workflow uses `pull_request_target` and a checkout.
      A job named `permission-check`, or `needs: permission-check`, is not an
      authorization boundary. Keep PR execution secretless or gate privileged
      capabilities with the fixed protected `privileged-pr-ci` environment. The
      base-owned PR CI policy guard is the structural authority. Please see
      https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      for additional mitigations.
    metadata:
      category: security
      owasp:
        - A01:2021 - Broken Access Control
      cwe:
        - "CWE-913: Improper Control of Dynamically-Managed Code Resources"
      references:
        - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
        - https://github.com/justinsteven/advisories/blob/master/2021_github_actions_checkspelling_token_leak_via_advice_symlink.md
      technology:
        - github-actions
      subcategory:
        - audit
      likelihood: MEDIUM
      impact: LOW
      confidence: MEDIUM
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      vulnerability_class:
        - Code Injection
    patterns:
      - pattern-either:
          - pattern-inside: |
              on:
                ...
                pull_request_target: ...
                ...
              ...
          - pattern-inside: |
              on: [..., pull_request_target, ...]
              ...
          - pattern-inside: |
              on: pull_request_target
              ...
      - pattern-inside: |
          jobs:
            ...
            $JOBNAME:
              ...
      - pattern: |
          ...
          uses: "$ACTION"
      - metavariable-regex:
          metavariable: $ACTION
          regex: actions/checkout@.*
    # Advisory only. The base-owned PR CI policy guard performs the bounded,
    # base/head structural comparison and is the blocking authority.
    severity: INFO
