name: "*run protected PR image tests"

on:
  workflow_call:
    inputs:
      VARIANT:
        required: true
        type: string
      IMAGE_MANIFEST_ID:
        required: true
        type: string
      SOURCE_REPOSITORY:
        required: true
        type: string
      SOURCE_SHA:
        required: true
        type: string
      PR_NUMBER:
        required: true
        type: string
      BASE_SHA:
        required: true
        type: string
      RUN_FAUCET:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  e2e-tests:
    if: vars.PROTECTED_RUNNERS_ENABLED == 'true'
    environment: privileged-pr-ci
    runs-on: runs-on/fleet=aptos-protected-e2e/env=protected
    permissions:
      contents: read
      id-token: write
    env:
      GCP_DOCKER_ARTIFACT_REPO: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}
    steps:
      - name: Record the protected deployment approval scope
        env:
          SOURCE_REPOSITORY: ${{ inputs.SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ inputs.SOURCE_SHA }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
        run: |
          {
            echo "## Protected PR E2E request"
            echo "Repository: \`$SOURCE_REPOSITORY\`"
            echo "PR: \`$PR_NUMBER\`"
            echo "Exact source SHA: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the exact trusted event base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.BASE_SHA }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the protected runtime from trusted base code
        id: setup
        uses: ./trusted-base/.github/actions/privileged-pr-runtime-setup
        with:
          source_repository: ${{ inputs.SOURCE_REPOSITORY }}
          source_sha: ${{ inputs.SOURCE_SHA }}
          pr_number: ${{ inputs.PR_NUMBER }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          artifact_repo: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}

      - name: Require one artifact ID from the protected producer
        env:
          IMAGE_MANIFEST_ID: ${{ inputs.IMAGE_MANIFEST_ID }}
        run: |
          [[ "$IMAGE_MANIFEST_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Missing protected image artifact ID"; exit 1; }

      - name: Download the protected producer manifest by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.IMAGE_MANIFEST_ID }}
          path: ${{ runner.temp }}/protected-image-input
          merge-multiple: true

      - name: Validate protected source and image digests
        uses: ./trusted-base/.github/actions/protected-image-manifest
        with:
          mode: verify
          manifest_path: ${{ runner.temp }}/protected-image-input/manifest.json
          source_repository: ${{ inputs.SOURCE_REPOSITORY }}
          source_sha: ${{ inputs.SOURCE_SHA }}
          pr_number: ${{ inputs.PR_NUMBER }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          variant: ${{ inputs.VARIANT }}
          artifact_repo: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}

      - name: Record protected test inputs
        env:
          SOURCE_REPOSITORY: ${{ inputs.SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ inputs.SOURCE_SHA }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          IMAGE_TAG: ${{ env.PR_IMAGE_TAG }}
        run: |
          {
            echo "## Protected PR image tests"
            echo "Repository: \`$SOURCE_REPOSITORY\`"
            echo "PR: \`$PR_NUMBER\`"
            echo "Exact source SHA: \`$SOURCE_SHA\`"
            echo "Immutable image tag: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh Google Cloud authentication for protected tests
        id: gcp-test-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          create_credentials_file: false
          token_format: access_token
          access_token_lifetime: 5400
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Refresh the US multi-region registry login for protected tests
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-test-auth.outputs.access_token }}

      - name: Refresh the us-west1 registry login for protected tests
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: us-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-test-auth.outputs.access_token }}

      - name: Create API specification output directory
        run: mkdir -p "$RUNNER_TEMP/specs"

      - name: Generate YAML API specification
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 3
          timeout_minutes: 20
          command: >-
            docker run --rm
            --mount=type=bind,source=$RUNNER_TEMP/specs,target=/specs
            ${PROTECTED_TOOLS_IMAGE}
            aptos-openapi-spec-generator -f yaml -o /specs/spec.yaml

      - name: Generate JSON API specification
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 3
          timeout_minutes: 20
          command: >-
            docker run --rm
            --mount=type=bind,source=$RUNNER_TEMP/specs,target=/specs
            ${PROTECTED_TOOLS_IMAGE}
            aptos-openapi-spec-generator -f json -o /specs/spec.json

      - name: Verify checked-in API specifications
        working-directory: pr-source
        run: |
          git diff --no-index --ignore-space-at-eol --ignore-blank-lines "$RUNNER_TEMP/specs/spec.yaml" api/doc/spec.yaml
          git diff --no-index --ignore-space-at-eol --ignore-blank-lines "$RUNNER_TEMP/specs/spec.json" api/doc/spec.json

      - name: Set up Python without a shared dependency cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: pr-source/.python-version

      - name: Install the pinned Poetry version
        run: python -m pip install --disable-pip-version-check poetry==2.1.2

      - name: Install CLI E2E dependencies
        working-directory: pr-source/crates/aptos/e2e
        run: poetry install --no-interaction

      - name: Run CLI tests against devnet
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 5
          timeout_minutes: 20
          command: >-
            cd pr-source/crates/aptos/e2e &&
            poetry run python main.py -d --base-network devnet
            --image-repo-with-project "$GCP_DOCKER_ARTIFACT_REPO"
            --test-cli-tag "${PR_IMAGE_TAG}"
            --working-directory "$RUNNER_TEMP/aptos-e2e-tests-devnet"

      - name: Run CLI tests against testnet
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 5
          timeout_minutes: 20
          command: >-
            cd pr-source/crates/aptos/e2e &&
            poetry run python main.py -d --base-network testnet
            --image-repo-with-project "$GCP_DOCKER_ARTIFACT_REPO"
            --test-cli-tag "${PR_IMAGE_TAG}"
            --working-directory "$RUNNER_TEMP/aptos-e2e-tests-testnet"

      - name: Run CLI tests against mainnet
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          max_attempts: 5
          timeout_minutes: 20
          command: >-
            cd pr-source/crates/aptos/e2e &&
            poetry run python main.py -d --base-network mainnet
            --image-repo-with-project "$GCP_DOCKER_ARTIFACT_REPO"
            --test-cli-tag "${PR_IMAGE_TAG}"
            --working-directory "$RUNNER_TEMP/aptos-e2e-tests-mainnet"

      - name: Set up Redis for faucet tests
        if: inputs.RUN_FAUCET
        uses: shogo82148/actions-setup-redis@88a1fb308aae95aa485bf3da667c9d6e61be4c53
        with:
          redis-version: "6.x"

      - name: Set up Rust for faucet tests without a shared target cache
        if: inputs.RUN_FAUCET
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621

      - name: Install faucet test dependencies
        if: inputs.RUN_FAUCET
        working-directory: pr-source/crates/aptos-faucet/integration-tests
        run: poetry install --no-interaction

      - name: Create faucet test output directory
        if: inputs.RUN_FAUCET
        run: mkdir -p "$RUNNER_TEMP/faucet-testnet"

      - name: Run faucet integration tests
        if: inputs.RUN_FAUCET
        working-directory: pr-source/crates/aptos-faucet/integration-tests
        run: >-
          poetry run python main.py
          --tag "${PR_IMAGE_TAG}"
          --base-network custom
          --external-test-dir "$RUNNER_TEMP/faucet-testnet"
          --image-repo-with-project "$GCP_DOCKER_ARTIFACT_REPO"

      - name: Print protected testnet logs on failure
        if: failure()
        run: |
          docker logs aptos-tools-devnet || true
          docker logs aptos-tools-testnet || true
          docker logs aptos-tools-mainnet || true
          docker logs local-testnet-custom || true
