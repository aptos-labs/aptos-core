name: "execution-performance"
on:
  workflow_dispatch:
  pull_request_target:
    types: [labeled, unlabeled, opened, synchronize, reopened]
  # schedule: # NOTE: the schedule is dictated by PIES

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: execution-performance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  compute-authorization:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.authorize.outputs.approved }}
      e2e_approved: ${{ fromJSON(steps.authorize.outputs.approvals)['CICD:run-e2e-tests'].approved }}
      all_e2e_approved: ${{ fromJSON(steps.authorize.outputs.approvals)['CICD:run-all-e2e-tests'].approved }}
      performance_approved: ${{ fromJSON(steps.authorize.outputs.approvals)['CICD:run-execution-performance-test'].approved }}
      full_approved: ${{ fromJSON(steps.authorize.outputs.approvals)['CICD:run-execution-performance-full-test'].approved }}
    steps:
      # pull_request_target resolves this checkout to base-owned code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Authorize execution-performance compute
        id: authorize
        uses: ./.github/actions/compute-authorized
        with:
          pr_number: ${{ github.event.pull_request.number }}
          required_labels: '["CICD:run-e2e-tests","CICD:run-all-e2e-tests","CICD:run-execution-performance-test","CICD:run-execution-performance-full-test"]'

  execution-performance:
    needs: compute-authorization
    if: github.event_name == 'pull_request_target' && needs.compute-authorization.outputs.approved == 'true'
    permissions:
      contents: read
    # Stops the called workflow from requesting cache writes.
    cache-mode: read
    uses: ./.github/workflows/workflow-run-execution-performance.yaml
    with:
      GIT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      GIT_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RUNNER_NAME: benchmark-c3d-60-pr
      # The full-test label alone selects the highest-cost flow.
      FLOW: ${{ needs.compute-authorization.outputs.full_approved == 'true' && 'CONTINUOUS' || 'LAND_BLOCKING' }}
      # The performance labels bypass target determination only after their own authorization.
      IGNORE_TARGET_DETERMINATION: ${{ needs.compute-authorization.outputs.all_e2e_approved == 'true' || needs.compute-authorization.outputs.performance_approved == 'true' || needs.compute-authorization.outputs.full_approved == 'true' }}

  execution-performance-dispatch:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-run-execution-performance.yaml
    with:
      GIT_REPOSITORY: ${{ github.repository }}
      GIT_SHA: ${{ github.sha }}
      RUNNER_NAME: benchmark-c3d-60
      FLOW: CONTINUOUS
      IGNORE_TARGET_DETERMINATION: true

  # Wrapper dispatch always notifies Slack on failure. The reusable workflow
  # retains a separate direct-dispatch opt-in notification interface.
  notify-slack:
    needs: execution-performance-dispatch
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.execution-performance-dispatch.result == 'failure' }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Post dispatch failure to Slack
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # pin@v3.0.1
        with:
          webhook: ${{ secrets.EXECUTION_PERF_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":x: execution-performance failed (flow: `CONTINUOUS`, runner: `benchmark-c3d-60`): <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|link>"
