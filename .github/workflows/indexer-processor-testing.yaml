name: Indexer processor transaction tests

on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    paths:
      - "ecosystem/indexer-grpc/indexer-test-transactions/**"
      - "ecosystem/indexer-grpc/indexer-transaction-generator/**"
    types: [labeled, unlabeled, opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: indexer-processor-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Trusted code comes from github.sha: the base branch head for pull_request_target
# and the dispatched commit for workflow_dispatch. Source data comes from
# `github.event.pull_request.head.sha || github.sha` in every job.
jobs:
  authorize:
    name: Authorize indexer processor compute
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ github.event_name == 'workflow_dispatch' || steps.compute.outputs.approved == 'true' }}
    steps:
      - name: Check out trusted base authorization code
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify current authorized compute label
        id: compute
        if: github.event_name == 'pull_request_target'
        uses: ./.github/actions/compute-authorized
        with:
          pr_number: ${{ github.event.pull_request.number }}
          required_label: CICD:run-indexer-processor-tests

  static_validation:
    name: Secretless indexer transaction generator validation
    needs: [authorize]
    if: needs.authorize.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out and verify the exact source data
        uses: ./.github/actions/checkout-exact-pr-source
        with:
          source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libssl-dev pkg-config protobuf-compiler
          rustup show

      - name: Build trusted transaction helper and generator
        working-directory: .
        run: >-
          cargo build
          --manifest-path ecosystem/indexer-grpc/indexer-transaction-generator/Cargo.toml
          --bin indexer-ci-helper
          --bin aptos-indexer-transaction-generator

      - name: Validate transaction generator configuration and placeholders
        shell: bash
        run: >-
          target/debug/indexer-ci-helper validate-config
          --config "$GITHUB_WORKSPACE/pr-source/ecosystem/indexer-grpc/indexer-transaction-generator/imported_transactions/imported_transactions.yaml"

      - name: Validate transaction generator CLI
        run: target/debug/aptos-indexer-transaction-generator --help

  live_generation:
    name: Live indexer generation ${{ github.event.pull_request.head.sha || github.sha }}
    needs: [authorize, static_validation]
    if: needs.authorize.outputs.approved == 'true'
    runs-on: runs-on,cpu=16,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    environment: privileged-pr-ci
    permissions:
      contents: read
      id-token: write
    outputs:
      dispatch_required: ${{ steps.diff_check.outputs.dispatch_required }}
    steps:
      - name: Record the exact approved source
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Approved source SHA: %s\n' "$APPROVED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the exact trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out and verify the exact source data
        uses: ./.github/actions/checkout-exact-pr-source
        with:
          source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld libssl-dev pkg-config protobuf-compiler
          rustup show

      - name: Build trusted transaction helper and generator
        working-directory: .
        run: >-
          cargo build
          --manifest-path ecosystem/indexer-grpc/indexer-transaction-generator/Cargo.toml
          --bin indexer-ci-helper
          --bin aptos-indexer-transaction-generator

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # pin@v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Read live API keys
        id: api_keys
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # pin@v2.2.5
        with:
          secrets: |-
            testnet_api_key:aptos-ci/TESTNET_INDEXER_API_KEY
            mainnet_api_key:aptos-ci/MAINNET_INDEXER_API_KEY

      - name: Materialize live API keys without logging configuration
        shell: bash
        env:
          TESTNET_API_KEY_VALUE: ${{ steps.api_keys.outputs.testnet_api_key }}
          MAINNET_API_KEY_VALUE: ${{ steps.api_keys.outputs.mainnet_api_key }}
        run: >-
          target/debug/indexer-ci-helper materialize-config
          --input "$GITHUB_WORKSPACE/pr-source/ecosystem/indexer-grpc/indexer-transaction-generator/imported_transactions/imported_transactions.yaml"
          --output "$RUNNER_TEMP/indexer-ci-imported-transactions/imported_transactions.yaml"

      - name: Generate live JSON transactions from the approved SHA
        run: |
          generation_root="$(mktemp -d "$RUNNER_TEMP/indexer-ci-generated.XXXXXX")"
          printf 'INDEXER_CI_GENERATED_ROOT=%s\n' "$generation_root" >> "$GITHUB_ENV"
          target/debug/aptos-indexer-transaction-generator \
            --testing-folder "$RUNNER_TEMP/indexer-ci-imported-transactions" \
            --output-folder "$generation_root"
          target/debug/aptos-indexer-transaction-generator \
            --testing-folder "$GITHUB_WORKSPACE/pr-source/ecosystem/indexer-grpc/indexer-transaction-generator/imported_transactions" \
            --output-folder "$generation_root" \
            --mode=script

      - name: Delete the materialized API keys
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/indexer-ci-imported-transactions"

      # Reads the baseline from the exact source checkout and normalizes scripted
      # transactions in memory. Writes diff_found, new_file_found, dispatch_required.
      - name: Compare generated JSON transactions
        id: diff_check
        run: >-
          target/debug/indexer-ci-helper compare
          --baseline-dir "$GITHUB_WORKSPACE/pr-source/ecosystem/indexer-grpc/indexer-test-transactions/src/json_transactions"
          --generated-dir "$INDEXER_CI_GENERATED_ROOT/json_transactions"
          --github-output "$GITHUB_OUTPUT"

  trusted_dispatch:
    name: Dispatch indexer processor ${{ github.event.pull_request.head.sha || github.sha }}
    needs: [live_generation]
    if: needs.live_generation.outputs.dispatch_required == 'true'
    runs-on: ubuntu-latest
    environment: privileged-pr-ci
    permissions:
      contents: read
    steps:
      - name: Check out the exact trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .trusted-ci

      - name: Dispatch and wait for the exactly correlated downstream run
        uses: ./.trusted-ci/.github/actions/indexer-processor-dispatch
        with:
          token: ${{ secrets.INDEXER_PROCESSOR_DISPATCH_TOKEN }}
          downstream_repository: aptos-labs/aptos-indexer-processors
          downstream_branch: main
          event_type: test-txn-json-change-detected
          approved_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          pr_number: ${{ github.event.pull_request.number || 0 }}
          source_run_id: ${{ github.run_id }}
          source_run_attempt: ${{ github.run_attempt }}
