name: Validate Hosted Rust CI
on:
  pull_request:
    paths:
      - .github/workflows/lint-test.yaml
      - .github/workflows/hosted-rust-unit-tests.yaml
      - .github/workflows/validate-hosted-rust-ci.yaml
      - .github/actions/rust-prebuilt-setup/**
      - .github/scripts/**
permissions:
  contents: read
jobs:
  workflow-contract:
    runs-on: 2cpu-gh-ubuntu24-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install contract-test dependencies
        run: python3 -m pip install --user PyYAML==6.0.3
      - name: Test fallback and static package coverage
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
  hosted-full-suite:
    if: ${{ !contains(github.base_ref, '-release-') }}
    needs: workflow-contract
    uses: ./.github/workflows/hosted-rust-unit-tests.yaml
    with:
      provider: hosted
