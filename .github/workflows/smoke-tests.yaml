name: Smoke artifact transfer comparison
on:
  workflow_dispatch:
    inputs:
      source-run:
        required: true
        type: string
      node-artifact:
        required: true
        type: string
      tests-artifact:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  producer:
    runs-on: runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    outputs:
      node-0: ${{ steps.node0.outputs.artifact-id }}
      tests-0: ${{ steps.tests0.outputs.artifact-id }}
      node-1: ${{ steps.node1.outputs.artifact-id }}
      tests-1: ${{ steps.tests1.outputs.artifact-id }}
      checksums: ${{ steps.hashes.outputs.checksums }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3be0111fe8a6d36c22aaad8972d44512b582e515
      - name: Download exact candidate node binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.source-run }}
          artifact-ids: ${{ inputs.node-artifact }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: target/release
      - name: Download exact candidate test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.source-run }}
          artifact-ids: ${{ inputs.tests-artifact }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Record identical file content and byte counts
        id: hashes
        run: |
          sha256sum target/release/aptos-node target/release/aptos target/release/aptos-debugger smoke-test-archive.tar.zst > checksums.txt
          cat checksums.txt
          wc -c target/release/aptos-node target/release/aptos target/release/aptos-debugger smoke-test-archive.tar.zst
          echo "checksums=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload node compression 0
        id: node0
        uses: actions/upload-artifact@v4
        with:
          name: transfer-node-0-${{ github.run_attempt }}
          path: target/release/aptos-node
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload tests compression 0
        id: tests0
        uses: actions/upload-artifact@v4
        with:
          name: transfer-tests-0-${{ github.run_attempt }}
          path: |
            target/release/aptos
            target/release/aptos-debugger
            smoke-test-archive.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload node compression 1
        id: node1
        uses: actions/upload-artifact@v4
        with:
          name: transfer-node-1-${{ github.run_attempt }}
          path: target/release/aptos-node
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - name: Upload tests compression 1
        id: tests1
        uses: actions/upload-artifact@v4
        with:
          name: transfer-tests-1-${{ github.run_attempt }}
          path: |
            target/release/aptos
            target/release/aptos-debugger
            smoke-test-archive.tar.zst
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  consumer:
    needs: producer
    runs-on: runs-on,cpu=16,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [1, 2, 3]
        compression: [0, 1]
    steps:
      - name: Download node
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ matrix.compression == 0 && needs.producer.outputs.node-0 || needs.producer.outputs.node-1 }}
          merge-multiple: true
          path: target/release
      - name: Download tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ matrix.compression == 0 && needs.producer.outputs.tests-0 || needs.producer.outputs.tests-1 }}
          merge-multiple: true
      - name: Verify identical bytes
        env:
          CHECKSUMS: ${{ needs.producer.outputs.checksums }}
        run: |
          printf '%s' "$CHECKSUMS" | base64 -d | sha256sum -c
          nproc
          free -b
          lscpu
