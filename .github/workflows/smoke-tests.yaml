name: "Smoke Tests"

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      only_docs_changed:
        description: "Whether only docs changed (skip smoke tests if true)"
        required: true
        type: string

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Build aptos-node separately due to feature unification issues.
  build-smoke-aptos-node:
    if: inputs.only_docs_changed != 'true'
    runs-on: runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sccache-setup
      - name: Build aptos-node
        run: python3 .github/scripts/ci_metrics.py run smoke-node-build -- cargo build --locked --package=aptos-node --features=failpoints,smoke-test --release
        shell: bash
      - name: Upload aptos-node binary
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          path: target/release/aptos-node
          name: smoke-aptos-node-${{ github.run_attempt }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - uses: ./.github/actions/ci-metrics-report
        if: always()
        with:
          name: smoke-node-build

  # Build test archive + helper binaries in parallel with aptos-node.
  build-smoke-tests:
    if: inputs.only_docs_changed != 'true'
    runs-on: runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sccache-setup
      - name: Build smoke test archive and helper binaries
        run: |
          # Build helper binaries needed by smoke tests
          python3 .github/scripts/ci_metrics.py run smoke-helpers-build -- cargo build --locked --release --package aptos --package aptos-debugger
          # Create nextest archive with compiled test binaries.
          # LOCAL_SWARM_NODE_RELEASE must be set at compile time (option_env!) so the
          # test binary uses the release aptos-node binary instead of building a debug one.
          LOCAL_SWARM_NODE_RELEASE=1 python3 .github/scripts/ci_metrics.py run smoke-archive-build -- cargo nextest archive --locked --release --package smoke-test --archive-file smoke-test-archive.tar.zst
        shell: bash
      - name: Upload smoke test archive and helper binaries
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            target/release/aptos
            target/release/aptos-debugger
            smoke-test-archive.tar.zst
          name: smoke-test-archive-${{ github.run_attempt }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - uses: ./.github/actions/ci-metrics-report
        if: always()
        with:
          name: smoke-tests-build

  # Run smoke tests in parallel partitions. This is a PR required job.
  rust-smoke-tests:
    needs: [build-smoke-aptos-node, build-smoke-tests]
    if: inputs.only_docs_changed != 'true'
    runs-on: runs-on,cpu=16,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - name: Run postgres database
        uses: ./.github/actions/postgres-start

      # Exact artifact IDs also work when only failed shard jobs are rerun.
      - name: Download aptos-node binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pin@v4
        with:
          path: target/release
          artifact-ids: ${{ needs.build-smoke-aptos-node.outputs.artifact-id }}
          merge-multiple: true

      - name: Download smoke test archive and helper binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pin@v4
        with:
          artifact-ids: ${{ needs.build-smoke-tests.outputs.artifact-id }}
          merge-multiple: true

      - name: Run smoke tests partition ${{ matrix.partition }}/8
        run: |
          chmod +x target/release/aptos-node target/release/aptos target/release/aptos-debugger
          SMOKE_TEST_PREBUILD_BINARIES=1 \
          SMOKE_TEST_BIN_DIR=${{ github.workspace }}/target/release \
          LOCAL_SWARM_NODE_RELEASE=1 \
          python3 .github/scripts/ci_metrics.py run smoke-shard -- cargo nextest run \
            --archive-file smoke-test-archive.tar.zst \
            --workspace-remap . \
            --profile smoke-test \
            --partition count:${{ matrix.partition }}/8
        shell: bash

      - uses: ./.github/actions/ci-metrics-report
        if: always()
        with:
          name: smoke-shard-${{ matrix.partition }}

      # Upload logs on failure for debugging.
      - name: Upload smoke test logs for failed and flaky tests
        if: ${{ failure() || success() }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-smoke-test-logs-${{ github.run_attempt }}-${{ matrix.partition }}
          include-hidden-files: true
          path: |
            /tmp/.tmp*
            !/tmp/.tmp*/**/db/
          retention-days: 14
