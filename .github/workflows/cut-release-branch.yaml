name: "Cut Release Branch"\non: \n  workflow_dispatch:\n    inputs:\n      NEW_VERSION:\n        required: true\n        type: string\n        description: The branch version to cut i.e. 1.4\n      GIT_HASH:\n        required: true\n        type: string\n        description: The git hash to use for the base of the new branch\n      BRANCH_PREFIX:\n        required: false\n        type: string\n        default: aptos-release-v\n        description: The prefix to use for the branch name\n      BRANCH_SUFFIX:\n        required: false\n        type: string\n        default: \n        description: The suffix to use for the branch name if any\n      \npermissions:\n  contents: read\n  id-token: write\n  issues: write\n  pull-requests: write\n\njobs:\n  cut-release-branch:\n    runs-on: 2cpu-gh-ubuntu24-x64\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          token: ${{ secrets.CUT_RELEASE_BRANCH_CREDENTIALS }}\n          fetch-depth: 0\n      - name: Cut Release Branch\n        env:\n          BRANCH_PREFIX: ${{ inputs.BRANCH_PREFIX }}\n          NEW_VERSION: ${{ inputs.NEW_VERSION }}\n          BRANCH_SUFFIX: ${{ inputs.BRANCH_SUFFIX }}\n          GIT_HASH: ${{ inputs.GIT_HASH }}\n        run: |\n          set -ex\n\n          BRANCH_NAME="${BRANCH_PREFIX}${NEW_VERSION}${BRANCH_SUFFIX}"\n          git branch\n\n          git checkout "$GIT_HASH"\n          git checkout -b "$BRANCH_NAME"\n\n          perl -i -pe "s/version\s*=\s*\"[^\"]*\"/version = \"${NEW_VERSION}.0\"/g" aptos-node/Cargo.toml\n\n          git push origin "$BRANCH_NAME"