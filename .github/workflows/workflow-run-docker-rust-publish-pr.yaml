name: "*rebuild and publish protected PR Docker images"

on:
  workflow_call:
    inputs:
      VARIANT:
        required: true
        type: string
      ADDITIONAL_TESTING_IMAGES:
        required: false
        default: false
        type: boolean
      SOURCE_REPOSITORY:
        required: true
        type: string
      SOURCE_SHA:
        required: true
        type: string
      PR_NUMBER:
        required: true
        type: string
      BASE_SHA:
        required: true
        type: string
      PROFILE:
        required: false
        default: release
        type: string
      FEATURES:
        required: false
        default: ""
        type: string
      BUILD_TARGET:
        required: false
        default: all
        type: string

    outputs:
      release_manifest:
        description: Protected release manifest artifact ID
        value: ${{ jobs.publish-images.outputs.release_manifest }}
      failpoints_manifest:
        description: Protected failpoints manifest artifact ID
        value: ${{ jobs.publish-images.outputs.failpoints_manifest }}
      performance_manifest:
        description: Protected performance manifest artifact ID
        value: ${{ jobs.publish-images.outputs.performance_manifest }}
      consensus_manifest:
        description: Protected consensus manifest artifact ID
        value: ${{ jobs.publish-images.outputs.consensus_manifest }}

permissions:
  contents: read

jobs:
  build-images:
    if: vars.PROTECTED_RUNNERS_ENABLED == 'true'
    runs-on: runs-on/fleet=aptos-protected-build/env=protected
    permissions:
      contents: read
    outputs:
      archive_id: ${{ steps.archive-upload.outputs.artifact-id }}
    steps:
      - name: Check out the exact trusted event base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.BASE_SHA }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Check build inputs against the trusted variant plan
        env:
          VARIANT: ${{ inputs.VARIANT }}
          PROFILE: ${{ inputs.PROFILE }}
          FEATURES: ${{ inputs.FEATURES }}
          BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
        run: |
          python3 -I - <<'PY'
          import os
          import sys
          sys.path.insert(0, "trusted-base/.github/ci")
          from ci_actions.docker_plan import load_manifest
          variants = {variant["id"]: variant for variant in load_manifest().variants}
          variant = variants.get(os.environ["VARIANT"])
          if variant is None or any(os.environ[name] != variant[field] for name, field in (
              ("PROFILE", "profile"), ("FEATURES", "features"), ("BUILD_TARGET", "build_target"))):
              raise SystemExit("Build inputs do not match trusted variant plan")
          PY

      - name: Check out the exact approved PR revision
        uses: ./trusted-base/.github/actions/checkout-exact-pr-source
        with:
          source_repository: ${{ inputs.SOURCE_REPOSITORY }}
          source_sha: ${{ inputs.SOURCE_SHA }}

      - name: Set up an isolated protected Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: protected-pr-${{ github.run_id }}-${{ github.run_attempt }}
          keep-state: false
          cleanup: true
          cache-binary: false

      - name: Build exact PR images locally without registry credentials
        env:
          BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
          PROFILE: ${{ inputs.PROFILE }}
          FEATURES: ${{ inputs.FEATURES }}
          BUILD_ADDL_TESTING_IMAGES: ${{ inputs.ADDITIONAL_TESTING_IMAGES }}
          GCP_DOCKER_ARTIFACT_REPO: aptos-ci
          TARGET_CACHE_ID: pr-${{ inputs.PR_NUMBER }}-${{ inputs.SOURCE_SHA }}
          TARGET_REGISTRY: local
          IMAGE_TAG_PREFIX: ''
        working-directory: pr-source
        run: |
          set -euo pipefail
          CI=false docker/builder/docker-bake-rust-all.sh "$BUILD_TARGET"

      - name: Export the fixed Docker image archives
        uses: ./trusted-base/.github/actions/image-archive
        with:
          mode: export-build
          directory: ${{ runner.temp }}/protected-image-archives
          source_repository: ${{ inputs.SOURCE_REPOSITORY }}
          source_sha: ${{ inputs.SOURCE_SHA }}
          base_sha: ${{ inputs.BASE_SHA }}
          pr_number: ${{ inputs.PR_NUMBER }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          variant: ${{ inputs.VARIANT }}
          artifact_repo: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}

      - name: Upload the fixed image archives
        id: archive-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-image-archives-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.VARIANT }}
          path: ${{ runner.temp }}/protected-image-archives/
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  publish-images:
    if: vars.PROTECTED_RUNNERS_ENABLED == 'true'
    needs: build-images
    environment: privileged-pr-ci
    runs-on: runs-on/fleet=aptos-protected-build/env=protected
    permissions:
      contents: read
      id-token: write
    outputs:
      release_manifest: ${{ inputs.VARIANT == 'release' && steps.manifest-upload.outputs.artifact-id || '' }}
      failpoints_manifest: ${{ inputs.VARIANT == 'failpoints' && steps.manifest-upload.outputs.artifact-id || '' }}
      performance_manifest: ${{ inputs.VARIANT == 'performance' && steps.manifest-upload.outputs.artifact-id || '' }}
      consensus_manifest: ${{ inputs.VARIANT == 'consensus' && steps.manifest-upload.outputs.artifact-id || '' }}
    steps:
      - name: Record the protected deployment approval scope
        env:
          SOURCE_REPOSITORY: ${{ inputs.SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ inputs.SOURCE_SHA }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
        run: |
          {
            echo "## Protected PR image publication request"
            echo "Repository: \`$SOURCE_REPOSITORY\`"
            echo "PR: \`$PR_NUMBER\`"
            echo "Exact source SHA: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the exact trusted event base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.BASE_SHA }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Require the exact build artifact ID
        env:
          ARCHIVE_ID: ${{ needs.build-images.outputs.archive_id }}
        run: |
          [[ "$ARCHIVE_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Missing protected build artifact ID"; exit 1; }

      - name: Download the exact build artifact by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-images.outputs.archive_id }}
          path: ${{ runner.temp }}/protected-image-archives
          merge-multiple: true

      - name: Authenticate to the protected registry
        uses: ./trusted-base/.github/actions/gcp-registry-auth
        with:
          create_credentials_file: false
          access_token_lifetime: 5400
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install the archive to registry copy tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Validate and publish the exact build archives
        uses: ./trusted-base/.github/actions/image-archive
        with:
          mode: publish-build
          directory: ${{ runner.temp }}/protected-image-archives
          source_repository: ${{ inputs.SOURCE_REPOSITORY }}
          source_sha: ${{ inputs.SOURCE_SHA }}
          base_sha: ${{ inputs.BASE_SHA }}
          pr_number: ${{ inputs.PR_NUMBER }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          variant: ${{ inputs.VARIANT }}
          artifact_repo: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}

      - name: Select the exact trusted base commit for controller image tagging
        env:
          BASE_SHA: ${{ inputs.BASE_SHA }}
          RUN_ID: ${{ github.run_id }}
        working-directory: trusted-base
        run: git checkout -B "protected-controller-$RUN_ID" "$BASE_SHA"

      - name: Set up a trusted Docker builder for the controller image
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: protected-controller-${{ github.run_id }}-${{ github.run_attempt }}
          keep-state: false
          cleanup: true
          cache-binary: false

      - name: Build and publish the trusted controller image
        env:
          PROFILE: release
          FEATURES: ''
          GCP_DOCKER_ARTIFACT_REPO: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}
          TARGET_CACHE_ID: controller-${{ inputs.BASE_SHA }}
          TARGET_REGISTRY: gcp
          IMAGE_TAG_PREFIX: controller-r${{ github.run_id }}-a${{ github.run_attempt }}_
        working-directory: trusted-base
        run: |
          set -euo pipefail
          CI=true docker/builder/docker-bake-rust-all.sh forge

      - name: Collect protected image digests from the registry
        uses: ./trusted-base/.github/actions/protected-image-manifest
        with:
          mode: collect
          manifest_path: ${{ runner.temp }}/protected-image-output/manifest.json
          source_repository: ${{ inputs.SOURCE_REPOSITORY }}
          source_sha: ${{ inputs.SOURCE_SHA }}
          base_sha: ${{ inputs.BASE_SHA }}
          pr_number: ${{ inputs.PR_NUMBER }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}
          variant: ${{ inputs.VARIANT }}
          artifact_repo: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}

      - name: Upload the protected image manifest
        id: manifest-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-images-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.VARIANT }}
          path: ${{ runner.temp }}/protected-image-output/manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Record the protected exact-SHA publication
        env:
          SOURCE_REPOSITORY: ${{ inputs.SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ inputs.SOURCE_SHA }}
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
        run: |
          {
            echo "## Protected PR image publication"
            echo "Repository: \`$SOURCE_REPOSITORY\`"
            echo "PR: \`$PR_NUMBER\`"
            echo "Exact source SHA: \`$SOURCE_SHA\`"
            echo "Recorded image digests are bound to this PR, full SHA and workflow attempt."
          } >> "$GITHUB_STEP_SUMMARY"
