name: "Framework function usage: Mainnet"

on:
  schedule:
    # Analyze the previous completed UTC week after allowing six hours for
    # archive snapshots and images to settle.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        required: false
        type: string
        description: Optional tools image commit; defaults to the current branch.
      START_VERSION:
        required: false
        type: string
        description: First ledger version. Mutually exclusive with START_TIME.
      END_VERSION:
        required: false
        type: string
        description: Last ledger version. Mutually exclusive with END_TIME.
      START_TIME:
        required: false
        type: string
        description: 'Start time, for example "7 days ago" or "2026-08-01" (UTC).'
      END_TIME:
        required: false
        type: string
        description: 'End time, for example "now" or "2026-08-08" (UTC).'
      DRY_RUN:
        required: false
        type: boolean
        description: Validate inputs without building or running workers.
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Every run publishes the same stable "latest" path, including manual runs
  # started from non-default branches.
  group: framework-usage-mainnet-publisher
  cancel-in-progress: false

jobs:
  prepare-range:
    runs-on: ubuntu-latest
    outputs:
      start_version: ${{ steps.range.outputs.start_version }}
      end_version: ${{ steps.range.outputs.end_version }}
      start_time: ${{ steps.range.outputs.start_time }}
      end_time: ${{ steps.range.outputs.end_time }}
    steps:
      - name: Select analysis range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START_VERSION: ${{ inputs.START_VERSION }}
          INPUT_END_VERSION: ${{ inputs.END_VERSION }}
          INPUT_START_TIME: ${{ inputs.START_TIME }}
          INPUT_END_TIME: ${{ inputs.END_TIME }}
        run: |
          START_VERSION="$INPUT_START_VERSION"
          END_VERSION="$INPUT_END_VERSION"
          START_TIME="$INPUT_START_TIME"
          END_TIME="$INPUT_END_TIME"

          if [ "$EVENT_NAME" = "schedule" ]; then
            NOW_EPOCH="$(date --utc +%s)"
            DAY_START_EPOCH="$((NOW_EPOCH - NOW_EPOCH % 86400))"
            DAYS_SINCE_MONDAY="$(($(date --utc +%u) - 1))"
            END_EPOCH="$((DAY_START_EPOCH - DAYS_SINCE_MONDAY * 86400))"
            START_EPOCH="$((END_EPOCH - 7 * 86400))"
            START_TIME="$(date --utc --date="@${START_EPOCH}" '+%Y-%m-%d %H:%M:%S UTC')"
            END_TIME="$(date --utc --date="@${END_EPOCH}" '+%Y-%m-%d %H:%M:%S UTC')"
          fi

          {
            echo "start_version=$START_VERSION"
            echo "end_version=$END_VERSION"
            echo "start_time=$START_TIME"
            echo "end_time=$END_TIME"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Framework usage analysis range"
            echo
            if [ -n "$START_VERSION" ] || [ -n "$END_VERSION" ]; then
              echo "Ledger versions: ${START_VERSION:-archive start} through ${END_VERSION:-archive end}"
            else
              echo "UTC: $START_TIME through $END_TIME"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  collect:
    needs: prepare-range
    uses: ./.github/workflows/workflow-run-replay-verify-on-archive.yaml
    secrets:
      APTOS_BOT_PAT: ${{ secrets.APTOS_BOT_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_DOCKER_ARTIFACT_REPO: ${{ secrets.AWS_DOCKER_ARTIFACT_REPO }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ENV_ECR_AWS_ACCOUNT_NUM: ${{ secrets.ENV_ECR_AWS_ACCOUNT_NUM }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
    with:
      NETWORK: mainnet
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      START_VERSION: ${{ needs.prepare-range.outputs.start_version }}
      END_VERSION: ${{ needs.prepare-range.outputs.end_version }}
      START_TIME: ${{ needs.prepare-range.outputs.start_time }}
      END_TIME: ${{ needs.prepare-range.outputs.end_time }}
      FRAMEWORK_USAGE: true
      FRAMEWORK_USAGE_BUCKET: ${{ vars.FRAMEWORK_USAGE_BUCKET }}
      DRY_RUN: ${{ inputs.DRY_RUN || false }}
