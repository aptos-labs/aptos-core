name: Backport to Release Branches 

on:
  pull_request_target:
    types: ["labeled", "closed"]

permissions:
  contents: write
  pull-requests: write

jobs:
  permission-check:
    if: github.event.pull_request.merged == true && contains(join(github.event.pull_request.labels.*.name, ','), 'v1.')
    runs-on: 2cpu-gh-ubuntu24-x64
    steps:
      - name: Check repository permission for user which triggered workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          if ! perm=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq .permission); then
            echo "::error::Could not look up repository permission for $ACTOR."; exit 1
          fi
          case "$perm" in
            admin|write) echo "$ACTOR has $perm permission" ;;
            *) echo "::error::Sorry, you don't have permission to trigger this workflow ($ACTOR has '$perm', write required)."; exit 1 ;;
          esac

  backport:
    name: Backport PR
    needs: [permission-check]
    runs-on: 2cpu-gh-ubuntu24-x64
    steps:
      - name: Backport Action
        uses: sorenlouv/backport-github-action@ad888e978060bc1b2798690dd9d03c4036560947
        with:
          github_token: ${{ secrets.APTOS_BOT_PAT }}
          add_original_reviewers: true 

      - name: Info log
        if: ${{ success() }}
        run: cat ~/.backport/backport.info.log
        
      - name: Debug log
        if: ${{ failure() }}
        run: cat ~/.backport/backport.debug.log        
