name: Backport to Release Branches 

on:
  pull_request_target:
    types: ["labeled", "closed"]

# The backport action writes through the bot token. GITHUB_TOKEN only reads the
# sender's repository permission, which needs no scope beyond metadata. No step
# checks out or runs pull request code.
permissions: {}

jobs:
  authorize-sender:
    name: Authorize sender
    if: github.event.pull_request.merged == true && contains(join(github.event.pull_request.labels.*.name, ','), 'v1.')
    runs-on: 2cpu-gh-ubuntu24-x64
    steps:
      - name: Require write permission for the sender
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${REPO}/collaborators/${SENDER}/permission" --jq .permission)"
          case "$permission" in
            admin|write) echo "Sender ${SENDER} has ${permission} permission." ;;
            *) echo "::error::Sender ${SENDER} has ${permission} permission. Backport requires write."; exit 1 ;;
          esac

  backport:
    name: Backport PR
    needs: [authorize-sender]
    runs-on: 2cpu-gh-ubuntu24-x64
    steps:
      - name: Backport Action
        uses: sorenlouv/backport-github-action@ad888e978060bc1b2798690dd9d03c4036560947
        with:
          github_token: ${{ secrets.APTOS_BOT_PAT }}
          add_original_reviewers: true 

      - name: Info log
        if: ${{ success() }}
        run: cat ~/.backport/backport.info.log
        
      - name: Debug log
        if: ${{ failure() }}
        run: cat ~/.backport/backport.debug.log        
