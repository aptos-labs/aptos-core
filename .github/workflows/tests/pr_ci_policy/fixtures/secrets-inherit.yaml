name: inherit
on: pull_request_target
permissions:
  contents: read
jobs:
  call:
    uses: aptos-labs/aptos-core/.github/workflows/reusable.yaml@main
    with:
      GIT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      GIT_SHA: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
