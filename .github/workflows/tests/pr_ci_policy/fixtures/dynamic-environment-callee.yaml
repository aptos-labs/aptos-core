name: dynamic-callee
on:
  workflow_call:
    inputs:
      SOURCE_REPOSITORY:
        required: true
        type: string
      SOURCE_SHA:
        required: true
        type: string
jobs:
  publish:
    environment: ${{ inputs.ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
    runs-on: benchmark-c3d-60-pr
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.SOURCE_REPOSITORY }}
          ref: ${{ inputs.SOURCE_SHA }}
