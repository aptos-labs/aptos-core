name: overridden workflow env secret
on: pull_request_target
permissions:
  contents: read
env:
  DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: harmless
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./tests.sh
