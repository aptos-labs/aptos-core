name: unsafe-bracket-secret
on: pull_request_target
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./tests.sh
        env:
          TOKEN: ${{ secrets['DEPLOY_TOKEN'] }}
