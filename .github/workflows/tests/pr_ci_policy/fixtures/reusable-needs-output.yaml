name: reusable-needs
on: pull_request_target
permissions:
  contents: read
jobs:
  call:
    permissions:
      contents: write
    uses: aptos-labs/aptos-core/.github/workflows/reusable.yaml@main
    with:
      SOURCE_REPOSITORY: ${{ needs.resolve.outputs.repository }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
