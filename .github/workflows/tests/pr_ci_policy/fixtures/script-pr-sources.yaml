name: script and API PR sources
on: pull_request_target
permissions:
  contents: write
jobs:
  event-path-expression:
    runs-on: ubuntu-latest
    steps:
      - run: jq .pull_request.head.sha "${{ github.event_path }}"
  context-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: core.info(String(context.issue.number))
  context-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: core.info(context.payload.pull_request.head.sha)
  github-rest-pulls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: 42 })
  octokit-rest-pulls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await octokit.rest.pulls.get({ owner: 'aptos-labs', repo: 'aptos-core', pull_number: 42 })
  github-rest-get-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.getRef({ owner: 'aptos-labs', repo: 'aptos-core', ref: 'pull/42/head' })
  process-env-event-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const event = JSON.parse(require('fs').readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
            core.info(event.pull_request.head.sha)
  github-request-pulls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.request('GET /repos/{owner}/{repo}/pulls')
  github-graphql-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.graphql('query { repository(owner: "aptos-labs", name: "aptos-core") { pullRequest(number: 42) { headRefOid } } }')
