name: CI Benchmark

# Called by Lint+Test's benchmark-only dispatch on the candidate branch.
# All samples check out that same commit.
on:
  workflow_call:
    inputs:
      suite:
        type: string
        default: small
        description: Fixed package selection shared by baseline and candidate

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CI_BENCHMARK_PACKAGES: ${{ inputs.suite == 'large' && 'e2e-move-tests aptos-api move-prover move-compiler-v2 move-prover-boogie-backend move-prover-e2e-tests' || inputs.suite == 'medium' && 'move-compiler-v2 move-prover-boogie-backend move-prover-e2e-tests' || 'aptos-cargo-cli' }}
  INDEXER_DATABASE_URL: postgresql://postgres@localhost/postgres
  RUST_MIN_STACK: "4297152"
  MVP_TEST_ON_CI: "true"
  Z3_EXE: /home/runner/bin/z3
  CVC5_EXE: /home/runner/bin/cvc5
  DOTNET_ROOT: /home/runner/.dotnet
  BOOGIE_EXE: /home/runner/.dotnet/tools/boogie

jobs:
  lightweight-checks:
    if: inputs.suite == 'small'
    runs-on: 2cpu-gh-ubuntu24-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-check-merge-base
      - name: Validate CI helpers on Linux
        run: |
          node --test .github/scripts/*.test.cjs
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Exercise a missing artifact
        id: missing-artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pin@v4
        with:
          artifact-ids: "0"
      - name: Require missing-artifact failure
        env:
          OUTCOME: ${{ steps.missing-artifact.outcome }}
        run: test "$OUTCOME" = failure

  baseline:
    runs-on: runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Original tool setup
        run: python3 .github/scripts/ci_metrics.py run setup -- scripts/dev_setup.sh -b -p -r -y -P -t
      - name: Run postgres database
        run: docker run --detach -p 5432:5432 cimg/postgres:14.2
      - name: Original build-and-run path
        run: python3 .github/scripts/ci_metrics.py run baseline -- python3 .github/scripts/targeted_tests.py run --profile ci --cargo-profile ci --locked --no-fail-fast --retries 3
      - name: Record inventory after the timed baseline
        run: |
          read -ra packages <<< "$CI_BENCHMARK_PACKAGES"
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          cargo nextest list --profile ci --locked --cargo-profile ci "${args[@]}" -T json > ci-metrics/inventory.json
      - uses: ./.github/actions/ci-metrics-report
        if: always()
        with:
          name: baseline-${{ matrix.sample }}

  candidate:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    uses: ./.github/workflows/targeted-unit-tests.yaml
    with:
      benchmark-packages: ${{ inputs.suite == 'large' && 'e2e-move-tests aptos-api move-prover move-compiler-v2 move-prover-boogie-backend move-prover-e2e-tests' || inputs.suite == 'medium' && 'move-compiler-v2 move-prover-boogie-backend move-prover-e2e-tests' || 'aptos-cargo-cli' }}
      run-name: candidate-${{ matrix.sample }}

  verify-inventories:
    needs: [baseline, candidate]
    if: ${{ !cancelled() }}
    runs-on: 2cpu-gh-ubuntu24-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pin@v4
        with:
          pattern: ci-metrics-*
          path: metrics
      - name: Require identical inventories and complete disjoint partitions
        env:
          PYTHONPATH: .github/scripts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from ci_metrics import check_partitions, execution_mode, inventory
          root = Path('metrics')
          def latest(prefix):
              # A failed-jobs rerun can retain successful artifacts from an earlier attempt.
              candidates = list(root.glob(f'ci-metrics-{prefix}-*'))
              artifact = max(candidates, key=lambda path: int(path.name.rsplit('-', 1)[1]))
              return json.loads((artifact / 'inventory.json').read_text())
          for sample in (1, 2, 3):
              baseline = latest(f'baseline-{sample}')
              candidate = latest(f'candidate-{sample}-build')
              complete = inventory(baseline, include_filtered=True)
              check_partitions(complete, [inventory(candidate, include_filtered=True)])
              expected = inventory(baseline)
              check_partitions(expected, [inventory(candidate)])
              if execution_mode(candidate['test-count'], 3000) == 'shard':
                  shards = [latest(f'candidate-{sample}-shard-{partition}') for partition in range(1, 9)]
                  check_partitions(expected, [inventory(shard) for shard in shards])
              print(f'Sample {sample}: {len(complete)} total, {len(expected)} runnable tests; exact inventory and partition match')
          PY
