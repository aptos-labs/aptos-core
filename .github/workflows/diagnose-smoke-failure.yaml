name: Diagnose smoke failure
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Failed GitHub Actions job ID
        required: true
        type: string
        default: "88895849775"
      run_id:
        description: Workflow run ID
        required: true
        type: string
        default: "29908567425"
      pr_number:
        description: PR number to comment on
        required: true
        type: string
        default: "20171"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch job logs and extract failure
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_ID: ${{ inputs.run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag
          echo "Downloading logs for job $JOB_ID ..."
          if ! gh run view --job "$JOB_ID" --repo "${{ github.repository }}" --log > /tmp/diag/job.log 2>/tmp/diag/log.err; then
            echo "gh run view --log failed:" | tee /tmp/diag/summary.md
            cat /tmp/diag/log.err | tee -a /tmp/diag/summary.md
            # Fall back to artifact
            echo "Trying artifact download..." | tee -a /tmp/diag/summary.md
            gh run download "$RUN_ID" --repo "${{ github.repository }}" -n failed-smoke-test-logs-4 -D /tmp/diag/artifact || true
          fi

          {
            echo "## Smoke partition failure diagnosis"
            echo
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
            echo "- Job: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$JOB_ID"
            echo
            echo "### nextest / cargo failure excerpts"
            echo '```'
            # Prefer structured failure lines from nextest
            if [[ -f /tmp/diag/job.log ]]; then
              grep -n -iE 'FAIL|FAILED|error:|panicked|test result|failures:|Canceling|RETRY|try #|slow timeout|Summary|──|━━' /tmp/diag/job.log \
                | tail -n 200 || true
              echo
              echo "---- last 80 lines ----"
              tail -n 80 /tmp/diag/job.log || true
            else
              echo "No job.log available"
              find /tmp/diag -type f | head -100 || true
            fi
            echo '```'
          } > /tmp/diag/comment.md

          # Keep comment within GitHub size limits
          if [[ $(wc -c < /tmp/diag/comment.md) -gt 60000 ]]; then
            head -c 60000 /tmp/diag/comment.md > /tmp/diag/comment.trimmed.md
            echo -e "\n\n_(truncated)_" >> /tmp/diag/comment.trimmed.md
            mv /tmp/diag/comment.trimmed.md /tmp/diag/comment.md
          fi

          cat /tmp/diag/comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/diag/comment.md
