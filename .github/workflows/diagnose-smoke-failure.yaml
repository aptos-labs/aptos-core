name: Diagnose smoke failure
on:
  push:
    branches: [cursor/diagnose-smoke-partition4-15d2]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JOB_ID: "88895849775"
      RUN_ID: "29908567425"
      PR_NUMBER: "20171"
    steps:
      - name: Extract exact panic message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view --job "$JOB_ID" --repo "${{ github.repository }}" --log > /tmp/job.log
          {
            echo "## Exact panic for smoke partition 4"
            echo
            echo '```'
            # Print each panic site plus following 12 lines
            awk '/panicked at testsuite\/smoke-test\/src\/genesis.rs:420/{c=12} c&&c--{print}' /tmp/job.log | head -n 80
            echo
            echo "---- TRY/Summary lines ----"
            grep -E 'TRY [0-9] (FAIL|PASS)|Summary \[|Cancelling due' /tmp/job.log | head -n 40
            echo
            echo "---- println progress markers ----"
            grep -E 'Starting a 5 node|Enabling \`sync_only\`|Deleting one validator|Stopping three|Generating a genesis|Applying the genesis|Verifying that' /tmp/job.log | head -n 40
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md
