name: "Build+Test Docker Images"

on:
  pull_request_target:
    types: [labeled, unlabeled, opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compute-authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out base-owned authorization code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - id: plan
        uses: ./.github/actions/docker-capability-plan
        with:
          pr_number: ${{ github.event.pull_request.number }}

  # Jobs without `always()` run only after compute-authorization succeeded,
  # and a successful compute-authorization always emits a validated plan, so
  # they read the plan without a fallback. Every `.enabled`/workload flag in
  # the plan is final: approvals and the documentation-only rule are applied.
  pr-rust-images-local:
    needs: [compute-authorization]
    if: fromJSON(needs.compute-authorization.outputs.plan).local.enabled == true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compute-authorization.outputs.plan).local.include }}
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-run-docker-rust-build-pr.yaml
    with:
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROFILE: ${{ matrix.profile }}
      FEATURES: ${{ matrix.features }}
      BUILD_TARGET: ${{ matrix.build_target }}

  pr-publish-rust-images:
    needs: [compute-authorization, pr-rust-images-local]
    if: fromJSON(needs.compute-authorization.outputs.plan).publish.enabled == true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compute-authorization.outputs.plan).publish.include }}
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-docker-rust-publish-pr.yaml
    with:
      VARIANT: ${{ matrix.id }}
      ADDITIONAL_TESTING_IMAGES: ${{ matrix.additional_testing_images }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROFILE: ${{ matrix.profile }}
      FEATURES: ${{ matrix.features }}
      BUILD_TARGET: ${{ matrix.build_target }}

  pr-node-cli-faucet-tests:
    needs: [compute-authorization, pr-rust-images-local, pr-publish-rust-images]
    if: fromJSON(needs.compute-authorization.outputs.plan).workloads.pr-node-cli-faucet-tests == true
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-pr-e2e-tests.yaml
    with:
      VARIANT: release
      IMAGE_MANIFEST_ID: ${{ needs.pr-publish-rust-images.outputs.release_manifest }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RUN_FAUCET: ${{ contains(github.event.pull_request.labels.*.name, 'CICD:non-required-tests') }}

  pr-forge-e2e:
    needs: [compute-authorization, pr-rust-images-local, pr-publish-rust-images]
    if: fromJSON(needs.compute-authorization.outputs.plan).workloads.pr-forge-e2e == true
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-forge-pr.yaml
    with:
      VARIANT: release
      IMAGE_MANIFEST_ID: ${{ needs.pr-publish-rust-images.outputs.release_manifest }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      FORGE_TEST_SUITE: realistic_env_max_load
      NAMESPACE_KIND: e2e
      FORGE_RUNNER_DURATION_SECS: 480

  pr-forge-compat:
    needs: [compute-authorization, pr-rust-images-local, pr-publish-rust-images]
    if: fromJSON(needs.compute-authorization.outputs.plan).workloads.pr-forge-compat == true
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-forge-pr.yaml
    with:
      VARIANT: release
      IMAGE_MANIFEST_ID: ${{ needs.pr-publish-rust-images.outputs.release_manifest }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      FORGE_TEST_SUITE: compat
      NAMESPACE_KIND: compat
      USE_BASELINE_IMAGE: true
      FORGE_RUNNER_DURATION_SECS: 300

  pr-forge-performance:
    needs: [compute-authorization, pr-rust-images-local, pr-publish-rust-images]
    if: fromJSON(needs.compute-authorization.outputs.plan).workloads.pr-forge-performance == true
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-forge-pr.yaml
    with:
      VARIANT: performance
      IMAGE_MANIFEST_ID: ${{ needs.pr-publish-rust-images.outputs.performance_manifest }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      FORGE_TEST_SUITE: realistic_env_max_load
      NAMESPACE_KIND: performance
      PROFILE: performance
      FORGE_ENABLE_PERFORMANCE: true
      FORGE_RUNNER_DURATION_SECS: 480

  pr-forge-framework-upgrade:
    needs: [compute-authorization, pr-rust-images-local, pr-publish-rust-images]
    if: fromJSON(needs.compute-authorization.outputs.plan).workloads.pr-forge-framework-upgrade == true
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-forge-pr.yaml
    with:
      VARIANT: release
      IMAGE_MANIFEST_ID: ${{ needs.pr-publish-rust-images.outputs.release_manifest }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      FORGE_TEST_SUITE: framework_upgrade
      NAMESPACE_KIND: framework
      USE_BASELINE_IMAGE: true
      FORGE_RUNNER_DURATION_SECS: 3600

  pr-forge-consensus-only:
    needs: [compute-authorization, pr-rust-images-local, pr-publish-rust-images]
    if: fromJSON(needs.compute-authorization.outputs.plan).workloads.pr-forge-consensus-only == true
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-forge-pr.yaml
    with:
      VARIANT: consensus
      IMAGE_MANIFEST_ID: ${{ needs.pr-publish-rust-images.outputs.consensus_manifest }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      FORGE_TEST_SUITE: consensus_only_realistic_env_max_tps
      NAMESPACE_KIND: consensus
      FEATURES: consensus-only-perf-test
      FORGE_RUNNER_DURATION_SECS: 300

  pr-forge-multiregion:
    needs: [compute-authorization, pr-rust-images-local, pr-publish-rust-images]
    if: fromJSON(needs.compute-authorization.outputs.plan).workloads.pr-forge-multiregion == true
    permissions: {contents: read, id-token: write}
    uses: ./.github/workflows/workflow-run-forge-pr.yaml
    with:
      VARIANT: release
      IMAGE_MANIFEST_ID: ${{ needs.pr-publish-rust-images.outputs.release_manifest }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      FORGE_TEST_SUITE: multiregion_benchmark_test
      NAMESPACE_KIND: multiregion
      FORGE_CLUSTER_NAME: forge-multiregion
      FORGE_RUNNER_DURATION_SECS: 300

  # One base-owned marker per active Forge workload. Each leg mirrors its
  # workload's conclusion under the manifest marker ID, which the trusted
  # workflow_run reporter reads through the jobs API. A job-level `if` cannot
  # read `matrix`, so the plan lists only active markers; the reporter treats
  # an absent marker as "did not run". These jobs never check out PR code.
  forge-report-source:
    name: ${{ matrix.marker }}
    needs:
      - compute-authorization
      - pr-forge-e2e
      - pr-forge-compat
      - pr-forge-performance
      - pr-forge-framework-upgrade
      - pr-forge-consensus-only
      - pr-forge-multiregion
    if: always() && fromJSON(needs.compute-authorization.outputs.plan || '{}').markers.enabled == true
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compute-authorization.outputs.plan).markers.include }}
    env:
      SECURE_RESULT: ${{ needs[matrix.workload].result }}
    steps:
      - name: Mirror the protected Forge result
        run: |
          test "$SECURE_RESULT" = "success" || {
            echo "Protected Forge result: $SECURE_RESULT"
            exit 1
          }

  # This job checks the base-owned plan against the authoritative manifest and
  # evaluates every required Docker check. It never executes PR code.
  evaluate-pr-statuses:
    needs:
      - compute-authorization
      - pr-rust-images-local
      - pr-publish-rust-images
      - pr-node-cli-faucet-tests
      - pr-forge-e2e
      - pr-forge-compat
      - pr-forge-performance
      - pr-forge-framework-upgrade
      - pr-forge-consensus-only
      - pr-forge-multiregion
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      statuses: ${{ steps.status.outputs.statuses }}
    steps:
      - name: Check out base-owned status evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Evaluate every required Docker check
        id: status
        uses: ./.github/actions/docker-status-plan
        with:
          needs: ${{ toJSON(needs) }}

  # Branch protection requires these check names. The list is static so that
  # every name is reported even when planning or evaluation fails. A Ruby
  # test requires it to equal the manifest's image_check plus workload checks.
  required-check:
    name: ${{ matrix.check }}
    needs: [evaluate-pr-statuses]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        check:
          - rust-images
          - node-api-compatibility-tests
          - cli-e2e-tests
          - faucet-tests-main
          - forge-e2e-test
          - forge-compat-test
          - forge-framework-upgrade-test
          - forge-consensus-only-perf-test
          - forge-multiregion-test
    env:
      STATUS_OK: ${{ fromJSON(needs.evaluate-pr-statuses.outputs.statuses || '{}')[matrix.check] }}
    steps:
      - name: Require centralized Docker status
        run: test "$STATUS_OK" = "true"
