# This defines a workflow to build and release a new version of the aptos CLI.
# In order to trigger it go to the Actions Tab of the Repo, click "Release CLI" and then "Run Workflow".

name: "Release CLI"

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        required: true
        description: "The release version. E.g. `0.2.3`:"
      source_git_ref_override:
        type: string
        required: false
        description: "GIT_SHA_OVERRIDE: Use this to override the Git SHA1, branch name (e.g. devnet) or tag to build the binaries from. Defaults to the workflow Git REV, but can be different than that:"
      dry_run:
        type: boolean
        required: false
        default: true
        description: "Dry run - If checked, the release will not be created"
      skip_checks:
        type: boolean
        required: false
        default: false
        description: "Skip checks - If checked, the release will skip the version format and already-released checks (Cargo.toml must still match the release version, and re-releasing a version requires deleting its existing release and tag first)"

permissions:
  contents: read


jobs:
  # Update checks compare the binary's embedded Cargo version with release tags.
  # Resolves the one commit that every job builds and the release tags, and checks
  # that it contains the version used in the release tag.
  preflight:
    name: "Check release version"
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_git_ref_override }}
          sparse-checkout: crates/aptos/Cargo.toml
          sparse-checkout-cone-mode: false
      - name: Check crates/aptos/Cargo.toml version
        id: check
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n '/^\w*version = /p' crates/aptos/Cargo.toml | sed 's/^.*=[ ]*"//g' | sed 's/".*$//g')
          if [[ "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Wanted to release $RELEASE_VERSION, but crates/aptos/Cargo.toml at $SHA says $VERSION"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # TODO: Deprecated, please use "Linux" instead as it's more straightforwardly named
  build-ubuntu22-binary:
    name: "Build Ubuntu 22.04 binary"
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: aptos-labs/aptos-core/.github/actions/cli-rust-setup@main
      - name: Build CLI
        run: scripts/cli/build_cli_release.sh "Ubuntu-22.04" "${{inputs.release_version}}" "${{inputs.skip_checks}}" "false"
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds-ubuntu-22.04
          path: aptos-cli-*.zip

  # Add one for 24.04 to be clear
  build-ubuntu24-binary:
    name: "Build Ubuntu 24.04 binary"
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: aptos-labs/aptos-core/.github/actions/cli-rust-setup@main
      - name: Build CLI
        run: scripts/cli/build_cli_release.sh "Ubuntu-24.04" "${{inputs.release_version}}" "${{inputs.skip_checks}}" "false"
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds-ubuntu-24.04
          path: aptos-cli-*.zip

  # Generic linux should be the older version, more likely compatible
  # This actually builds for non-SIMD processors, and an older GLIBC
  # TODO: Possibly find a way to support a baseline GLIBC rather than just whatever is on 22.04
  build-linux-binary:
    name: "Build Linux binary"
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: aptos-labs/aptos-core/.github/actions/cli-rust-setup@main
      - name: Build CLI
        run: scripts/cli/build_cli_release.sh "Linux" "${{inputs.release_version}}" "${{inputs.skip_checks}}" "true"
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds-linux
          path: aptos-cli-*.zip

  # Generic linux arm should be the older version, more likely compatible
  build-linux-arm-binary:
    name: "Build Linux ARM binary"
    needs: preflight
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: aptos-labs/aptos-core/.github/actions/cli-rust-setup@main
      - name: Build CLI
        run: scripts/cli/build_cli_release.sh "Linux" "${{inputs.release_version}}" "${{inputs.skip_checks}}" "false"
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds-linux-arm
          path: aptos-cli-*.zip

  build-macos-x86_64-binary:
    name: "Build MacOS x86_64 binary"
    needs: preflight
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: aptos-labs/aptos-core/.github/actions/cli-rust-setup@main
      - name: Build CLI
        run: scripts/cli/build_cli_release.sh "macOS" "${{inputs.release_version}}" "${{inputs.skip_checks}}" "false"
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds-macos-x86-64
          path: aptos-cli-*.zip

  build-macos-arm-binary:
    name: "Build MacOS ARM binary"
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: aptos-labs/aptos-core/.github/actions/cli-rust-setup@main
      - name: Build CLI
        run: scripts/cli/build_cli_release.sh "macOS" "${{inputs.release_version}}" "${{inputs.skip_checks}}" "false"
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds-macos-arm
          path: aptos-cli-*.zip

  build-windows-binary:
    name: "Build Windows binary"
    needs: preflight
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      # Ensure that long paths work
      - name: Ensure long paths work
        run: git config --global core.longpaths true
        shell: bash
      - name: Build CLI
        run: scripts\cli\build_cli_release.ps1
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds-windows
          path: aptos-cli-*.zip

  release-binaries:
    name: "Release binaries"
    needs:
      - preflight
      - build-ubuntu22-binary
      - build-ubuntu24-binary
      - build-windows-binary
      - build-linux-binary
      - build-linux-arm-binary
      - build-macos-arm-binary
      - build-macos-x86_64-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: "write"
      pull-requests: "read"
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-builds-*
          merge-multiple: true
      # With files attached, `gh release create` creates a draft, uploads the files, then
      # publishes, so the tag and release only appear once every binary is available.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          TAG="aptos-cli-v$RELEASE_VERSION"
          TAGS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/aptos-cli-v" --jq '.[].ref | ltrimstr("refs/tags/")')
          # GitHub ignores --target for an existing tag, so the release would attach to its commit.
          if grep -Fxq "$TAG" <<< "$TAGS"; then
            echo "Tag $TAG already exists. Delete it first: gh release delete $TAG --cleanup-tag, or git push --delete origin $TAG if it has no release."
            exit 1
          fi
          # Release notes cover the changes since the highest stable CLI tag below this one, if any.
          PREVIOUS_TAG=$({ grep -E '^aptos-cli-v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$TAGS"; echo "$TAG"; } \
            | sort -u -V | grep -Fx -B1 "$TAG" | grep -Fvx "$TAG" || true)
          NOTES_START=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            NOTES_START=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" aptos-cli-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Aptos CLI Release v$RELEASE_VERSION" \
            --generate-notes \
            "${NOTES_START[@]}" \
            --latest

  bump-homebrew-version-pr:
    name: "Make PR to bump version in Homebrew"
    needs:
      - release-binaries
    # GitHub-hosted ubuntu-24.04 ships Linuxbrew preinstalled, which the
    # action below requires. The previous self-hosted runner did not.
    runs-on: ubuntu-24.04
    steps:
      # mislav/bump-homebrew-formula-action@v3 broke after GitHub changed
      # authenticated tarball redirects from HTTP 302 to 303 (upstream
      # mislav/bump-homebrew-formula-action#340, no patch released).
      # dawidd6/action-homebrew-bump-formula wraps `brew bump-formula-pr`,
      # which handles redirects correctly.
      - uses: dawidd6/action-homebrew-bump-formula@1446dca236b0440c6f02723a3f14f13be2c04ab0 # pin@v7
        with:
          token: ${{ secrets.APTOS_BOT_GH_PAT_APTOS_CORE_HOMEBREW_BUMPER }}
          formula: aptos
          tag: "${{ format('aptos-cli-v{0}', inputs.release_version) }}"
          message: |
            From CLI release run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
