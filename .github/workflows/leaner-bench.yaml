# The Leaner verification benchmark (third_party/move/lean/designs/verification-benchmarks.md):
# measures the standard problems of third_party/move/lean/bench/problems.toml,
# keeps the results as an artifact, and reports them against the recent runs.
name: Leaner verification benchmark

on:
  # PIES dispatches this workflow nightly on main. GitHub cron is prohibited by
  # repository policy. See devtools/aptos-cargo-cli/README.md.
  workflow_dispatch:
    inputs:
      PROBLEMS:
        description: Comma-separated problem names to measure (all when empty)
        required: false
        type: string
        default: ""
      WINDOW:
        description: Number of recent runs the report plots
        required: false
        type: choice
        options: ["10", "30", "60", "90"]
        default: "30"

permissions:
  contents: read

# Every nightly produces a point; never cancel one for another.
concurrency:
  group: leaner-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    # The dedicated runner of the execution performance test, in its queue,
    # so no other benchmark shares the machine.
    runs-on: benchmark-c3d-60
    concurrency:
      group: execution-benchmark-benchmark-c3d-60
      cancel-in-progress: false
      queue: max
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Lean toolchain
        run: |
          scripts/dev_setup.sh -b -p -l -k
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build the standalone exchange frontend
        run: cargo build --locked --profile ci -p aptos-move-cli --features binary --bin move

      - name: Install the Rust exporter's pinned toolchain
        working-directory: third_party/move/lean/leaner-rust/rust-exporter
        run: cargo --version

      - name: Build the benchmark executable
        working-directory: third_party/move/lean/leaner-e2e-tests
        run: |
          source "$HOME/.profile"
          lake build leaner-bench

      - name: Measure the problems
        env:
          RUNNER_NAME: benchmark-c3d-60
          PROBLEMS: ${{ inputs.PROBLEMS }}
        run: |
          source "$HOME/.profile"
          python3 third_party/move/lean/scripts/leaner-bench.py run \
            --out "$RUNNER_TEMP/leaner-bench/results.json" ${PROBLEMS:+--only "$PROBLEMS"}

      - uses: actions/upload-artifact@v4
        with:
          name: leaner-bench-results
          path: ${{ runner.temp }}/leaner-bench/results.json
          if-no-files-found: error
          retention-days: 90

  report:
    needs: bench
    runs-on: 2cpu-gh-ubuntu24-x64
    permissions:
      contents: read
      actions: read # the results of earlier runs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: third_party/move/lean/scripts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: leaner-bench-results
          path: ${{ runner.temp }}/current

      - name: Render the report
        env:
          GH_TOKEN: ${{ github.token }}
          LEANER_BENCH_CACHE: ${{ runner.temp }}/cache
          WINDOW: ${{ inputs.WINDOW || '30' }}
        run: |
          python3 third_party/move/lean/scripts/leaner-bench.py report \
            --current "$RUNNER_TEMP/current/results.json" --window "$WINDOW" \
            --branch "$GITHUB_REF_NAME" \
            --html "$RUNNER_TEMP/leaner-bench-report.html" \
            --markdown "$RUNNER_TEMP/summary.md" --slack "$RUNNER_TEMP/slack.json"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: leaner-bench-report
          path: ${{ runner.temp }}/leaner-bench-report.html
          retention-days: 90

      - name: Post to Slack
        # Nightlies on main report; a delivery error does not fail the run,
        # whose success the history reads.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # pin@v3.0.1
        with:
          webhook: ${{ secrets.EXECUTION_PERF_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack.json
