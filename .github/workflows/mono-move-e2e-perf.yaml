name: "mono-move-e2e-perf"
on:
  workflow_call:
    inputs:
      GIT_SHA:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      RUNNER_NAME:
        required: false
        type: choice
        options: [benchmark-c3d-60]
        default: benchmark-c3d-60
      REPEATS:
        required: false
        type: choice
        options: ["1", "3", "5"]
        default: "3"
      NUM_BLOCKS_PER_TEST:
        required: false
        type: choice
        options: ["5", "10", "30", "50"]
        default: "30"
      SELF_COMPARE:
        description: "Run V1 VM against itself; every ratio should come out at ~1.00x"
        required: false
        type: boolean
        default: false
      BUILD:
        required: false
        type: choice
        options: [release, performance]
        default: release
  pull_request_target:
    types: [labeled, unlabeled, opened, synchronize, reopened]

concurrency:
  group: mono-move-e2e-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Each output is one expression over the event, so the PR and manual values
  # sit side by side and no step writes them.
  compute-authorization:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ github.event_name == 'workflow_dispatch' || steps.authorize.outputs.approved == 'true' }}
      run_mode: ${{ github.event_name == 'pull_request_target' && 'pr' || 'manual' }}
      source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      source_sha: ${{ inputs.GIT_SHA || github.event.pull_request.head.sha || github.sha }}
      runner: ${{ github.event_name == 'pull_request_target' && 'benchmark-c3d-60-pr' || inputs.RUNNER_NAME || 'benchmark-c3d-60' }}
      runner_name: ${{ github.event_name == 'pull_request_target' && 'benchmark-c3d-60-pr' || inputs.RUNNER_NAME || 'benchmark-c3d-60' }}
      repeats: ${{ github.event_name == 'pull_request_target' && '3' || inputs.REPEATS || '3' }}
      num_blocks_per_test: ${{ github.event_name == 'pull_request_target' && '30' || inputs.NUM_BLOCKS_PER_TEST || '30' }}
      self_compare: ${{ github.event_name == 'workflow_dispatch' && inputs.SELF_COMPARE && '1' || '' }}
      build: ${{ github.event_name == 'pull_request_target' && 'release' || inputs.BUILD || 'release' }}
      run_source: ${{ github.event_name == 'pull_request_target' && 'ci' || 'manual' }}
      pr_number: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted base authorization code
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify PR compute authorization
        id: authorize
        if: github.event_name == 'pull_request_target'
        uses: ./.github/actions/compute-authorized
        with:
          pr_number: ${{ github.event.pull_request.number }}
          required_label: mono-move-e2e-perf

  # This exact job name is part of the Humio calibration query contract.
  mono-move-e2e-perf:
    needs: compute-authorization
    if: ${{ needs.compute-authorization.outputs.approved == 'true' }}
    runs-on: ${{ needs.compute-authorization.outputs.runner }}
    concurrency:
      group: execution-benchmark-${{ needs.compute-authorization.outputs.runner }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out trusted source verification action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          persist-credentials: false

      - name: Check out exact benchmark source
        uses: ./trusted-base/.github/actions/checkout-exact-pr-source
        with:
          source_repository: ${{ needs.compute-authorization.outputs.source_repository }}
          source_sha: ${{ needs.compute-authorization.outputs.source_sha }}
          path: .
          fetch-depth: 1

      - uses: aptos-labs/aptos-core/.github/actions/rust-setup@main

      - name: Install python dependencies
        run: TABULATE_INSTALL=lib-only pip install tabulate==0.9.0

      - name: Run mono-move e2e performance comparison
        id: perf
        env:
          RUN_SOURCE: ${{ needs.compute-authorization.outputs.run_source }}
          RUNNER_NAME: ${{ needs.compute-authorization.outputs.runner_name }}
          REPEATS: ${{ needs.compute-authorization.outputs.repeats }}
          NUM_BLOCKS_PER_TEST: ${{ needs.compute-authorization.outputs.num_blocks_per_test }}
          SELF_COMPARE: ${{ needs.compute-authorization.outputs.self_compare }}
          BUILD: ${{ needs.compute-authorization.outputs.build }}
          REPORT_PATH: ${{ needs.compute-authorization.outputs.run_mode == 'manual' && format('{0}/mono-move-e2e-perf.md', runner.temp) || '' }}
          PR_CI_REPORT_PATH: ${{ needs.compute-authorization.outputs.run_mode == 'pr' && format('{0}/pr-ci-report-v1.json', runner.temp) || '' }}
          PR_CI_PR_NUMBER: ${{ needs.compute-authorization.outputs.pr_number }}
          PR_CI_HEAD_SHA: ${{ needs.compute-authorization.outputs.source_sha }}
          PR_CI_RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          python3 third_party/move/mono-move/testsuite/e2e-perf/run_e2e_perf_test.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Write trusted manual step summary
        if: ${{ always() && needs.compute-authorization.outputs.run_mode == 'manual' }}
        env:
          REPORT_PATH: ${{ runner.temp }}/mono-move-e2e-perf.md
        run: |
          if [ -f "$REPORT_PATH" ]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### mono-move e2e performance\n\nThe run produced no report. See the job logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload typed PR report
        if: ${{ always() && needs.compute-authorization.outputs.run_mode == 'pr' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-report-v1
          path: ${{ runner.temp }}/pr-ci-report-v1.json
          if-no-files-found: error
          retention-days: 1

      - name: Fail on regression or unsupported workload
        if: ${{ steps.perf.outputs.exit_code != '0' }}
        run: |
          echo "mono-move e2e performance run failed. See the job log." >&2
          exit 1
