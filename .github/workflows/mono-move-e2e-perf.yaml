name: "mono-move-e2e-perf"
on:
  workflow_call:
    inputs:
      GIT_SHA:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      RUNNER_NAME:
        required: false
        type: choice
        options: [benchmark-c3d-60]
        default: benchmark-c3d-60
      # Bounded rather than free strings: both scale the work the benchmark
      # runner is asked to do, and it is shared.
      REPEATS:
        required: false
        type: choice
        options: ["1", "3", "5"]
        default: "3"
      NUM_BLOCKS_PER_TEST:
        required: false
        type: choice
        options: ["5", "10", "30", "50"]
        default: "30"
      SELF_COMPARE:
        description: "Run V1 VM against itself; every ratio should come out at ~1.00x"
        required: false
        type: boolean
        default: false
      BUILD:
        required: false
        type: choice
        options: [release, performance]
        default: release
      WORKLOADS:
        required: false
        type: string
        default: "no-op,apt-fa-transfer"
      THREADS:
        required: false
        type: string
        default: "2,4,8,16"
      PIN:
        required: false
        type: boolean
        default: true
      PROFILE:
        required: false
        type: string
        default: ""
  # Untrusted PR code runs on a self-hosted runner. Restricted to same-repo PRs
  # with the `mono-move-e2e-perf` label (forks excluded below); re-runs on each
  # push so a fix shows new numbers.
  pull_request:
    types: [labeled, opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-mono-move-e2e-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write # Post the sticky report comment.

jobs:
  # This job name is what the Humio calibration query filters on. Renaming it
  # silently empties the calibration history; keep it in sync with JOB_NAME in
  # third_party/move/mono-move/testsuite/e2e-perf/calibrate_e2e_perf_test.py.
  mono-move-e2e-perf:
    # Dispatch, or a same-repo (non-fork) PR carrying the label.
    if: |
      github.event_name != 'pull_request' ||
      (
        contains(github.event.pull_request.labels.*.name, 'mono-move-e2e-perf') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ inputs.RUNNER_NAME || 'benchmark-c3d-60' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.GIT_SHA || github.event.pull_request.head.sha || github.sha }}
          # Nothing here runs git against the remote, and cargo authenticates
          # with GIT_CREDENTIALS instead, so the job never needs this token.
          # Leaving it out of the workspace keeps it away from PR code.
          persist-credentials: false

      - uses: aptos-labs/aptos-core/.github/actions/rust-setup@main
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}

      - name: Install python dependencies
        run: TABULATE_INSTALL=lib-only pip install tabulate==0.9.0

      - name: Install samply
        if: ${{ inputs.PROFILE != '' }}
        continue-on-error: true
        run: |
          cargo install samply --locked
          sudo -n sysctl -w kernel.perf_event_paranoid=1 || echo "could not lower perf_event_paranoid"
          cat /proc/sys/kernel/perf_event_paranoid

      - name: Run mono-move scaling sweep (experiment)
        id: perf
        env:
          REPEATS: ${{ inputs.REPEATS || '3' }}
          BLOCKS: ${{ inputs.NUM_BLOCKS_PER_TEST || '30' }}
          WORKLOADS: ${{ inputs.WORKLOADS || 'no-op,apt-fa-transfer' }}
          THREADS: ${{ inputs.THREADS || '2,4,8,16' }}
          PIN: ${{ inputs.PIN && '1' || '' }}
          PROFILE: ${{ inputs.PROFILE || '' }}
          REPORT_PATH: ${{ runner.temp }}/mono-move-e2e-perf.md
        run: |
          set +e
          python3 third_party/move/mono-move/testsuite/e2e-perf/scaling_sweep.py
          code=$?
          if [ ! -f "$REPORT_PATH" ]; then
            printf '### scaling sweep\n\nNo report. See job logs.\n' > "$REPORT_PATH"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload profiles
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scaling-profiles
          path: /tmp/scaling-sweep/prof/
          if-no-files-found: ignore

      - name: Write step summary
        if: always()
        run: cat "${{ runner.temp }}/mono-move-e2e-perf.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        # A read-only token cannot comment; don't fail the job over it.
        continue-on-error: true
        if: ${{ always() && github.event.number != null }}
        uses: marocchino/sticky-pull-request-comment@39c5b5dc7717447d0cba270cd115037d32d28443 # pin@39c5b5dc7717447d0cba270cd115037d32d2844
        with:
          header: mono-move-e2e-perf
          recreate: true
          path: ${{ runner.temp }}/mono-move-e2e-perf.md

      - name: Fail on regression or unsupported workload
        if: ${{ steps.perf.outputs.exit_code != '0' }}
        run: |
          echo "mono-move e2e performance run failed. See the report above." >&2
          exit 1
