# These tests ensure that changes to the faucet itself or its code dependencies don't
# cause the faucet to stop working with the production (devnet and testnet) networks.
#
# For tests that prevent the node from breaking compatibility with the faucet, see
# faucet-tests-main.
#
# These tests use node images built from devnet / testnet so we don't need to use
# workflow_call to wait for the image build to finish. Nightly still calls this
# workflow with GIT_SHA so the backstop runs at that revision.
#
# The jobs run the exact PR head on pull_request with a read-only token and no
# credentials. They pull the public aptoslabs images from Docker Hub. The
# CICD:non-required-tests label only limits cost. It is not a trust boundary.

name: "Faucet Integration Tests: Prod"
on:
  workflow_call:
    inputs:
      GIT_SHA:
        required: true
        type: string

  pull_request:
    types: [labeled, opened, synchronize, reopened, auto_merge_enabled]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # workflow_dispatch is the nightly caller. Pull requests run only with the cost label.
  # These tests ensure that the faucet works with the nodes running on devnet.
  run-tests-devnet:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'CICD:non-required-tests')
    runs-on: runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.GIT_SHA || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-faucet-tests
        with:
          NETWORK: devnet
          GCP_DOCKER_ARTIFACT_REPO: aptoslabs

  # These tests ensure that the faucet works with the nodes running on testnet.
  run-tests-testnet:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'CICD:non-required-tests')
    runs-on: runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.GIT_SHA || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-faucet-tests
        with:
          NETWORK: testnet
          GCP_DOCKER_ARTIFACT_REPO: aptoslabs
