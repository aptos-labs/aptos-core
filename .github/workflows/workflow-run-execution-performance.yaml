name: "*run execution-performance reusable workflow"

on:
  # This allows the workflow to be triggered from another workflow
  workflow_call:
    inputs:
      GIT_SHA:
        required: true
        type: string
        description: The git SHA1 to test.
      RUNNER_NAME:
        required: false
        default: executor-benchmark-runner
        type: string
      FLOW:
        required: false
        default: CONTINUOUS
        type: string
        description: Which set of tests to run.
      IGNORE_TARGET_DETERMINATION:
        required: false
        default: false
        type: boolean
        description: Ignore target determination and run the tests
      SKIP_MOVE_E2E:
        required: false
        default: false
        type: boolean
        description: Whether to run or skip move-only e2e tests at the beginning.
      SOURCE:
        required: false
        default: CI
        type: string
      NUMBER_OF_EXECUTION_THREADS:
        required: false
        default: "32"
        type: string
      NOTIFY_SLACK:
        required: false
        default: false
        type: boolean
        description: Whether to post to Slack on failure
  # This allows the workflow to be triggered manually from the Github UI or CLI
  # NOTE: because the "number" type is not supported, we default to 720 minute timeout
  workflow_dispatch:
    inputs:
      GIT_SHA:
        required: true
        type: string
        description: The git SHA1 to test.
      RUNNER_NAME:
        required: false
        default: executor-benchmark-runner
        type: choice
        options:
        - executor-benchmark-runner
        - executor-benchmark-ext4
        - executor-benchmark-xfs
        - benchmark-t2d-32
        - benchmark-t2d-60
        - benchmark-c3d-30
        - benchmark-c3d-60
        - benchmark-c3d-180
        - benchmark-n4-32
        - benchmark-c4-32
        - benchmark-c4-48
        - benchmark-c4-96
        description: The name of the runner to use for the test. (which decides machine specs)
      NUMBER_OF_EXECUTION_THREADS:
        required: false
        default: "32"
        type: string
        description: Number of execution threads to use for the tests.
      FLOW:
        required: false
        default: LAND_BLOCKING
        options:
        - LAND_BLOCKING
        - CONTINUOUS
        - MAINNET
        - MAINNET_LARGE_DB
        - EXECUTORS
        - ORDER_BOOK
        type: choice
        description: Which set of tests to run. MAINNET/MAINNET_LARGE_DB are for performance validation of mainnet nodes.
      SKIP_MOVE_E2E:
        required: false
        default: false
        type: boolean
        description: Whether to skip move-only e2e tests at the beginning.
      IGNORE_TARGET_DETERMINATION:
        required: false
        default: true
        type: boolean
        description: Ignore target determination and run the tests
      SOURCE:
        required: false
        default: ADHOC
        options:
        - ADHOC
        type: choice
        description: Test source (always adhoc from here)
      NOTIFY_SLACK:
        required: false
        default: false
        type: boolean
        description: Whether to post to Slack on failure
permissions:
  contents: read

jobs:
  e2e-selection:
    if: ${{ !inputs.IGNORE_TARGET_DETERMINATION && github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/e2e-test-selection.yaml
    with:
      ARTIFACT_NAME: execution-performance
      GIT_SHA: ${{ inputs.GIT_SHA }}

  # This job determines which tests to run. A failed selection skips it, which
  # the benchmark job reports as a failure.
  test-target-determinator:
    needs: e2e-selection
    if: ${{ !cancelled() && needs.e2e-selection.result != 'failure' }}
    runs-on: 2cpu-gh-ubuntu24-x64
    outputs:
      run_execution_performance_test: ${{ inputs.IGNORE_TARGET_DETERMINATION || github.event_name == 'workflow_dispatch' || (contains(fromJSON(needs.e2e-selection.outputs.selected_e2e_tests || '[]'), 'execution-performance') && (needs.e2e-selection.outputs.mode == 'subsystem' || steps.determine_test_targets.outputs.run_execution_performance_test == 'true')) }}
    steps:
      # The legacy dependency selector still needs the actual tested revision.
      - uses: actions/checkout@v4
        if: needs.e2e-selection.outputs.mode != 'subsystem' && !inputs.IGNORE_TARGET_DETERMINATION && github.event_name != 'workflow_dispatch'
        with:
          ref: ${{ inputs.GIT_SHA }}
          fetch-depth: 0
      - name: Run the test target determinator
        if: needs.e2e-selection.outputs.mode != 'subsystem' && !inputs.IGNORE_TARGET_DETERMINATION && github.event_name != 'workflow_dispatch'
        id: determine_test_targets
        uses: ./.github/actions/test-target-determinator

  # Run single node execution performance tests
  single-node-performance:
    needs: test-target-determinator
    if: |
      !cancelled() && (
        needs.test-target-determinator.result != 'success' ||
        inputs.IGNORE_TARGET_DETERMINATION ||
        needs.test-target-determinator.outputs.run_execution_performance_test == 'true'
      )
    concurrency:
      group: execution-benchmark-${{ inputs.RUNNER_NAME }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 120
    runs-on: ${{ inputs.RUNNER_NAME }}
    steps:
      - name: Require successful test determination
        env:
          SELECTION_RESULT: ${{ needs.test-target-determinator.result }}
        run: test "$SELECTION_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.GIT_SHA }}
        if: ${{ inputs.IGNORE_TARGET_DETERMINATION || needs.test-target-determinator.outputs.run_execution_performance_test == 'true' }}

      - uses: aptos-labs/aptos-core/.github/actions/rust-setup@main
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
        if: ${{ inputs.IGNORE_TARGET_DETERMINATION || needs.test-target-determinator.outputs.run_execution_performance_test == 'true' }}

      - name: Run single node execution benchmark in performance build mode
        shell: bash
        run: TABULATE_INSTALL=lib-only pip install tabulate && FLOW="${{ inputs.FLOW }}" SOURCE="${{ inputs.SOURCE }}" RUNNER_NAME="${{ inputs.RUNNER_NAME }}" SKIP_MOVE_E2E="${{ inputs.SKIP_MOVE_E2E && '1' || '' }}" NUMBER_OF_EXECUTION_THREADS="${{ inputs.NUMBER_OF_EXECUTION_THREADS }}" testsuite/single_node_performance.py
        if: ${{ (inputs.IGNORE_TARGET_DETERMINATION || needs.test-target-determinator.outputs.run_execution_performance_test == 'true') }}

      - run: echo "Skipping single node execution performance! Unrelated changes detected."
        if: ${{ !inputs.IGNORE_TARGET_DETERMINATION && needs.test-target-determinator.outputs.run_execution_performance_test != 'true' }}

      - name: Post to Slack on failure
        if: ${{ failure() && inputs.NOTIFY_SLACK }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # pin@v3.0.1
        with:
          webhook: ${{ secrets.EXECUTION_PERF_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":x: execution-performance failed (flow: `${{ inputs.FLOW }}`, runner: `${{ inputs.RUNNER_NAME }}`): <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|link>"
