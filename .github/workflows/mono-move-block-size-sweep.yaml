name: "mono-move-block-size-sweep"
# Experiment, not for merge: Block-STM scaling of V1 and MonoMove by block size
# and thread count, one transaction per sender.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.label.name == 'mono-move-block-size-sweep' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    strategy:
      fail-fast: false
      matrix:
        workload: [no-op, apt-fa-transfer]
        block: [{ size: 1000, blocks: 50 }, { size: 10000, blocks: 10 }, { size: 100000, blocks: 4 }]
    runs-on: runs-on,cpu=64,family=c7a,disk=large,image=aptos-ubuntu-x64,spot=false,run-id=${{ github.run_id }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: aptos-labs/aptos-core/.github/actions/rust-setup@main
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}

      - name: Install python dependencies
        run: TABULATE_INSTALL=lib-only pip install tabulate==0.9.0

      - name: Run the sweep
        env:
          RUN_SOURCE: ci
          RUNNER_NAME: c7a-64
          REPEATS: "3"
          ONLY_WORKLOADS: ${{ matrix.workload }}
          BLOCK_SIZE: ${{ matrix.block.size }}
          NUM_BLOCKS_PER_TEST: ${{ matrix.block.blocks }}
          TXNS_PER_SENDER: "1"
          OUT_DIR: ${{ runner.temp }}/out
        run: |
          mkdir -p "$OUT_DIR"
          for t in 1 2 4 8 16; do
            echo "::group::threads $t"
            EXECUTION_THREADS=$t REPORT_PATH="$OUT_DIR/report-$t.md" \
              python3 third_party/move/mono-move/testsuite/e2e-perf/run_e2e_perf_test.py \
              2>&1 | tee "$OUT_DIR/log-$t.txt" | grep -E 'grep_json_mono_move_e2e_perf|Workload .* failed'
            grep -h 'grep_json_mono_move_e2e_perf' "$OUT_DIR/log-$t.txt" >> "$OUT_DIR/results.txt" || true
            echo "::endgroup::"
          done
          cat "$OUT_DIR"/report-*.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-size-sweep-${{ matrix.workload }}-${{ matrix.block.size }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
