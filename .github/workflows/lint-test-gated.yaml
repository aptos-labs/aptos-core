name: "Lint+Test gated"
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened, auto_merge_enabled]
  push:
    branches:
      - main
      - devnet
      - testnet
      - mainnet
      - aptos-node-v*
      - aptos-release-v*
  workflow_dispatch:
    inputs:
      rust_ci_provider:
        description: "Rust CI provider (default honors RUST_CI_PROVIDER, otherwise hosted)"
        type: choice
        default: default
        options: [default, hosted, aws]

env:
  HAS_BUILDPULSE_SECRETS: ${{ secrets.BUILDPULSE_ACCESS_KEY_ID != '' && secrets.BUILDPULSE_SECRET_ACCESS_KEY != '' }}
  HAS_DATADOG_SECRETS: ${{ secrets.DD_API_KEY != '' }}
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# cancel redundant builds
concurrency:
  # cancel redundant builds on PRs (only on PR, not on branches)
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read


jobs:
  # Selects hosted (Azure) vs AWS. Defaults to hosted; set repo variable
  # RUST_CI_PROVIDER=aws or dispatch with rust_ci_provider=aws to fall back.
  rust-ci-provider:
    runs-on: 2cpu-gh-ubuntu24-x64
    outputs:
      provider: ${{ steps.select.outputs.provider }}
    steps:
      - id: select
        env:
          MANUAL_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_ci_provider || 'default' }}
          CONFIGURED_PROVIDER: ${{ vars.RUST_CI_PROVIDER }}
        run: |
          provider="${CONFIGURED_PROVIDER:-hosted}"
          if [ "$MANUAL_PROVIDER" != default ]; then
            provider="$MANUAL_PROVIDER"
          fi
          case "$provider" in
            hosted|aws) printf 'provider=%s\n' "$provider" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::RUST_CI_PROVIDER must be hosted or aws"; exit 1 ;;
          esac

  # The gated jobs need file-change output in this workflow's needs graph.
  gated_file_change_determinator:
    runs-on: 2cpu-gh-ubuntu24-x64
    outputs:
      only_docs_changed: ${{ steps.determine_file_changes.outputs.only_docs_changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the file change determinator
        id: determine_file_changes
        uses: ./.github/actions/file-change-determinator

  # Run the crypto hasher domain separation checks.
  rust-cryptohasher-domain-separation-check:
    needs: [gated_file_change_determinator, rust-ci-provider]
    runs-on: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' && '64cpu-aptos-image-ubuntu22-x64' || format('runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id={0}', github.run_id) }}
    if: contains(github.event.pull_request.labels.*.name, 'CICD:non-required-tests')
    steps:
      - uses: actions/checkout@v4
      # cargo is only on PATH via the image toolchain on hosted; verify and export it.
      - uses: ./.github/actions/rust-prebuilt-setup
        if: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' }}
        with:
          cache-key: hosted-gated-cryptohasher
      - run: python3 scripts/check-cryptohasher-symbols.py

  # Run the docs tests. This is a PR required job.
  rust-doc-tests:
    if: | # Only run when an appropriate event occurs
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        contains(github.event.pull_request.labels.*.name, 'CICD:run-e2e-tests') ||
        github.event.pull_request.auto_merge != null
      )
    needs: rust-ci-provider
    runs-on: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' && '64cpu-aptos-image-ubuntu22-x64' || format('runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id={0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-prebuilt-setup
        if: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' }}
        with:
          cache-key: hosted-gated-doc-tests
      - name: Run rust doc tests
        uses: ./.github/actions/rust-doc-tests
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}

  # Select the E2E suites of this workflow. Pushes and manual dispatches retain
  # full coverage.
  e2e-test-determinator:
    if: | # Only run on each PR once an appropriate event occurs
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'CICD:run-e2e-tests') ||
      contains(github.event.pull_request.labels.*.name, 'CICD:run-all-e2e-tests') ||
      github.event.pull_request.auto_merge != null ||
      contains(github.event.pull_request.body, '#e2e')
    uses: ./.github/workflows/e2e-test-selection.yaml
    with:
      ARTIFACT_NAME: lint-test
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Run all rust smoke tests (build + parallel test partitions).
  rust-smoke-tests-workflow:
    needs: [gated_file_change_determinator, e2e-test-determinator]
    if: contains(fromJSON(needs.e2e-test-determinator.outputs.selected_e2e_tests || '[]'), 'smoke-tests')
    uses: ./.github/workflows/smoke-tests.yaml
    with:
      only_docs_changed: ${{ needs.gated_file_change_determinator.outputs.only_docs_changed }}

  # Required check compatibility shim. Maintains the "rust-smoke-tests" check name
  # that branch protection rules expect, while the actual work happens in smoke-tests.yaml.
  rust-smoke-tests:
    needs: [gated_file_change_determinator, e2e-test-determinator, rust-smoke-tests-workflow]
    if: | # Always evaluate so failures are reported, but only when smoke tests are expected
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        contains(github.event.pull_request.labels.*.name, 'CICD:run-e2e-tests') ||
        contains(github.event.pull_request.labels.*.name, 'CICD:run-all-e2e-tests') ||
        github.event.pull_request.auto_merge != null ||
        contains(github.event.pull_request.body, '#e2e')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke test results
        env:
          FILES_RESULT: ${{ needs.gated_file_change_determinator.result }}
          SELECTION_RESULT: ${{ needs.e2e-test-determinator.result }}
        run: |
          # A failed prerequisite also skips the smoke tests.
          if [ "$FILES_RESULT" != "success" ] || [ "$SELECTION_RESULT" != "success" ]; then
            echo "Smoke test prerequisites failed: files $FILES_RESULT, selection $SELECTION_RESULT"
            exit 1
          fi
          result="${{ needs.rust-smoke-tests-workflow.result }}"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "Smoke tests passed (result: $result)"
          else
            echo "Smoke tests failed: $result"
            exit 1
          fi

  # Run aptos-batch-encryption (i.e., with TypeScript/Node.js). This is a PR required job.
  # A skipped job satisfies the required check, so an unselected run reserves no
  # runner, while a failed prerequisite runs the job to fail it visibly.
  rust-batch-encryption-tests:
    if: | # Only run on each PR once an appropriate event occurs
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        contains(github.event.pull_request.labels.*.name, 'CICD:run-e2e-tests') ||
        contains(github.event.pull_request.labels.*.name, 'CICD:run-all-e2e-tests') ||
        github.event.pull_request.auto_merge != null ||
        contains(github.event.pull_request.body, '#e2e')
      ) && (
        needs.gated_file_change_determinator.result != 'success' ||
        needs.e2e-test-determinator.result != 'success' ||
        contains(fromJSON(needs.e2e-test-determinator.outputs.selected_e2e_tests || '[]'), 'batch-encryption')
      )
    needs: [gated_file_change_determinator, e2e-test-determinator, rust-ci-provider]
    runs-on: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' && '64cpu-aptos-image-ubuntu22-x64' || format('runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id={0}', github.run_id) }}
    steps:
      - name: Require successful prerequisites
        env:
          FILES_RESULT: ${{ needs.gated_file_change_determinator.result }}
          SELECTION_RESULT: ${{ needs.e2e-test-determinator.result }}
        run: test "$FILES_RESULT" = success && test "$SELECTION_RESULT" = success

      - uses: actions/checkout@v4
        if: needs.gated_file_change_determinator.outputs.only_docs_changed != 'true'

      # Hosted image provides the Rust toolchain; verify it instead of reinstalling.
      - uses: ./.github/actions/rust-prebuilt-setup
        if: ${{ needs.gated_file_change_determinator.outputs.only_docs_changed != 'true' && needs.rust-ci-provider.outputs.provider == 'hosted' }}
        with:
          cache-key: hosted-gated-batch-encryption
      # Image drift insurance: the image recipe installs Node (dev_setup -J), but the
      # manifest does not cover it; setup-node keeps this required check independent
      # of image rebuilds. AWS installs via dev_setup -J.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pin@v4
        if: ${{ needs.gated_file_change_determinator.outputs.only_docs_changed != 'true' && needs.rust-ci-provider.outputs.provider == 'hosted' }}
      - name: Run dev_setup.sh
        if: ${{ needs.gated_file_change_determinator.outputs.only_docs_changed != 'true' && needs.rust-ci-provider.outputs.provider != 'hosted' }}
        run: |
          scripts/dev_setup.sh -b -p -r -y -P -t -J
          # Source profile and add paths to GITHUB_PATH for subsequent steps
          source ~/.profile
          echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Run aptos-batch-encryption tests
        uses: ./.github/actions/rust-batch-encryption
        if: needs.gated_file_change_determinator.outputs.only_docs_changed != 'true'
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}

      - run: echo "Skipping aptos-batch-encryption tests! Unrelated changes detected."
        if: needs.gated_file_change_determinator.outputs.only_docs_changed == 'true'

  # Run all rust unit tests on request. Lint+Test runs them for release PRs.
  # The name differs from rust-unit-tests so a skipped run here cannot
  # replace its result.
  rust-all-unit-tests:
    if: | # Only run when requested
      contains(github.event.pull_request.labels.*.name, 'CICD:run-all-unit-tests') &&
      !contains(fromJSON('["devnet","testnet","mainnet"]'), github.event.pull_request.base.ref) &&
      !startsWith(github.event.pull_request.base.ref, 'aptos-release-v') &&
      !startsWith(github.event.pull_request.base.ref, 'aptos-node-v')
    needs: rust-ci-provider
    runs-on: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' && '64cpu-aptos-image-ubuntu22-x64' || format('runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id={0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-prebuilt-setup
        if: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' }}
        with:
          cache-key: hosted-gated-all-unit-tests
      # Install Move Prover tools
      - name: Run dev_setup.sh
        if: ${{ needs.rust-ci-provider.outputs.provider != 'hosted' }}
        run: |
          scripts/dev_setup.sh -b -y
      - name: Run rust unit tests
        uses: ./.github/actions/rust-unit-tests
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}

  # Run the cached packages build. This is advisory (non-blocking) because
  # concurrent PR merges can cause spurious staleness failures.
  rust-build-cached-packages:
    continue-on-error: true
    needs: [gated_file_change_determinator, rust-ci-provider]
    if: | # Only run on each PR once an appropriate event occurs
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        contains(github.event.pull_request.labels.*.name, 'CICD:run-e2e-tests') ||
        github.event.pull_request.auto_merge != null
      )
    runs-on: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' && '64cpu-aptos-image-ubuntu22-x64' || format('runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id={0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
        if: needs.gated_file_change_determinator.outputs.only_docs_changed != 'true'
      - uses: ./.github/actions/rust-prebuilt-setup
        if: ${{ needs.gated_file_change_determinator.outputs.only_docs_changed != 'true' && needs.rust-ci-provider.outputs.provider == 'hosted' }}
        with:
          cache-key: hosted-gated-cached-packages
      - name: Run aptos cached packages build test
        if: needs.gated_file_change_determinator.outputs.only_docs_changed != 'true'
        run: scripts/cargo_build_aptos_cached_packages.sh --check
      - run: echo "Skipping cached packages test! Unrelated changes detected."
        if: needs.gated_file_change_determinator.outputs.only_docs_changed == 'true'

  # Run the consensus only unit tests
  rust-consensus-only-unit-test:
    needs: rust-ci-provider
    runs-on: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' && '64cpu-aptos-image-ubuntu22-x64' || format('runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id={0}', github.run_id) }}
    if: contains(github.event.pull_request.labels.*.name, 'CICD:build-consensus-only-image')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-prebuilt-setup
        if: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' }}
        with:
          cache-key: hosted-gated-consensus-unit
      - run: cargo nextest run --locked --workspace --exclude smoke-test --exclude aptos-testcases --exclude aptos-api --exclude aptos-executor-benchmark --exclude aptos-backup-cli --retries 3 --no-fail-fast -F consensus-only-perf-test
        env:
          RUST_MIN_STACK: 4297152

  # Run the consensus only smoke test
  rust-consensus-only-smoke-test:
    needs: rust-ci-provider
    runs-on: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' && '64cpu-aptos-image-ubuntu22-x64' || format('runs-on,cpu=64,family=c7,disk=large,image=aptos-ubuntu-x64,run-id={0}', github.run_id) }}
    if: contains(github.event.pull_request.labels.*.name, 'CICD:build-consensus-only-image')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-prebuilt-setup
        if: ${{ needs.rust-ci-provider.outputs.provider == 'hosted' }}
        with:
          cache-key: hosted-gated-consensus-smoke
      # prebuild aptos-node binary, so that tests don't start before node is built.
      # also prebuild aptos-node binary as a separate step to avoid feature unification issues
      - run: cargo build --locked --package=aptos-node -F consensus-only-perf-test --release && LOCAL_SWARM_NODE_RELEASE=1 CONSENSUS_ONLY_PERF_TEST=1 cargo nextest run --release --package smoke-test -E "test(test_consensus_only_with_txn_emitter)" --run-ignored all

      # We always try to create the artifact, but it only creates on flaky or failed smoke tests -- when the directories are empty.
      - name: Upload smoke test logs for failed and flaky tests
        uses: actions/upload-artifact@v4
        if: ${{ failure() || success() }}
        with:
          name: failed-consensus-only-smoke-test-logs
          # Retain all smoke test data except for the db (which may be large).
          path: |
            /tmp/.tmp*
            !/tmp/.tmp*/**/db/
          retention-days: 14
