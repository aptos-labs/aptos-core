# SCRATCH-BRANCH EXPERIMENT, DO NOT MERGE: runner confirmation for the aligned +
# interleaved wall-clock gate. Dispatch with:
#   gh workflow run mono-move-micro-bench.yaml --ref <this-branch>
name: "mono-move-micro-bench"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-experiment:
    runs-on: benchmark-c3d-60
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        mode: [layout-v3, layout-v4, layout-v5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: aptos-labs/aptos-core/.github/actions/rust-setup@main
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}

      - name: Run experiment
        env:
          OUT_DIR: ${{ runner.temp }}/layout-exp-${{ matrix.mode }}
        run: bash third_party/move/mono-move/testsuite/benches/perf/layout_experiment.sh ${{ matrix.mode }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-exp-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/layout-exp-${{ matrix.mode }}/results.jsonl
            ${{ runner.temp }}/layout-exp-${{ matrix.mode }}/env.txt
            ${{ runner.temp }}/layout-exp-${{ matrix.mode }}/symbols.txt
