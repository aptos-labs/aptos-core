name: "mono-move-micro-bench"
on:
  workflow_dispatch:
  # Untrusted PR code runs on a self-hosted runner. Restricted to same-repo PRs
  # with the `mono-move` label (forks excluded below); re-runs on each push so a
  # fix shows new numbers.
  pull_request:
    types: [labeled, opened, synchronize, reopened]

concurrency:
  group: mono-move-micro-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # Post the sticky benchmark comment.

jobs:
  mono-move-micro-bench:
    # Dispatch, or a same-repo (non-fork) PR carrying the `mono-move` label.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.pull_request.labels.*.name, 'mono-move') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: benchmark-c3d-60
    timeout-minutes: 45
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Full history so the base ref is reachable.

      - uses: aptos-labs/aptos-core/.github/actions/rust-setup@main
        with:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}

      - name: Run A/B benchmark gate
        id: gate
        env:
          # The PR's own base branch, so a stacked PR is measured on its own change.
          BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set +e
          # run.sh resolves the merge-base of HEAD_SHA and BASE_REF itself.
          bash third_party/move/mono-move/testsuite/benches/perf/run.sh ab \
            "$BASE_REF" "$HEAD_SHA" \
            --out "$RUNNER_TEMP/mono-move-bench.md"
          code=$?
          # compare.py writes the report before reporting a regression, so a
          # missing report means the run failed rather than regressed.
          if [ "$code" = 1 ] && [ ! -f "$RUNNER_TEMP/mono-move-bench.md" ]; then
            code=2
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      # Always replace the PR comment, so a gate that never finished (build or
      # run failure, timeout, cancellation, setup failure) does not leave an
      # earlier push's report in place.
      - name: Ensure report exists
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/mono-move-bench.md" ]; then
            printf '### mono-move benchmark gate\n\nThe gate did not produce a report (build or run failure, timeout, or setup failure). See the job logs.\n' \
              > "$RUNNER_TEMP/mono-move-bench.md"
          fi

      - name: Write step summary
        if: always()
        run: cat "$RUNNER_TEMP/mono-move-bench.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        # A read-only token (e.g. fork PRs) cannot comment; don't fail the gate.
        continue-on-error: true
        if: ${{ always() && github.event.number != null }}
        uses: marocchino/sticky-pull-request-comment@39c5b5dc7717447d0cba270cd115037d32d28443 # pin@39c5b5dc7717447d0cba270cd115037d32d2844
        with:
          header: mono-move-micro-bench
          recreate: true
          path: ${{ runner.temp }}/mono-move-bench.md

      - name: Fail on regression or bench error
        if: ${{ steps.gate.outputs.exit_code != '0' }}
        env:
          EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" = "1" ]; then
            echo "mono-move benchmark gate failed: a gated bench regressed beyond the threshold. See the report above." >&2
          else
            echo "mono-move benchmark gate failed: benches did not build or run cleanly. See the job logs." >&2
          fi
          exit 1
