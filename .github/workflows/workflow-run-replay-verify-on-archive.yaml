name: "*run replay-verify on archive reusable workflow"

on:
  # This allows the workflow to be triggered from another workflow
  workflow_call:
    inputs:
      NETWORK:
        required: true
        type: string
        description: The network to run replay verify on.
      IMAGE_TAG:
        required: false
        type: string
        description: The image tag of the feature branch to test, if not specified, it will use the latest commit on current branch.
      START_VERSION:
        required: false
        type: string
        description: Optional version to start replaying. If not specified, replay-verify will determines start version itself.
      END_VERSION:
        required: false
        type: string
        description: Optional version to end replaying. If not specified, replay-verify will determines end version itself.
      START_TIME:
        required: false
        type: string
        description: 'Optional start time (e.g. "2 hours ago", "2026-03-19", "2026-03-19 10:00"). UTC assumed. Mutually exclusive with START_VERSION.'
      END_TIME:
        required: false
        type: string
        description: 'Optional end time. Same formats as START_TIME. Mutually exclusive with END_VERSION.'
      DRY_RUN:
        required: false
        type: boolean
        description: If true, the workflow will not run replay verify.
        default: false
      FRAMEWORK_USAGE:
        required: false
        type: boolean
        description: Collect framework function usage instead of only replay-verifying.
        default: false
    secrets:
      APTOS_BOT_PAT:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_DOCKER_ARTIFACT_REPO:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      ENV_ECR_AWS_ACCOUNT_NUM:
        required: false
      GCP_SERVICE_ACCOUNT_EMAIL:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GIT_CREDENTIALS:
        required: false

  workflow_dispatch:
    inputs:
      NETWORK:
        required: true
        type: string
        description: The network to run replay verify on.
      IMAGE_TAG:
        required: false
        type: string
        description: The image tag of the feature branch to test, if not specified, it will use the latest commit on current branch.
      START_VERSION:
        required: false
        type: string
        description: The history start to use for the backup. If not specified, it will use the default history start.
      END_VERSION:
        required: false
        type: string
        description: The end version to use for the backup. If not specified, it will use the latest version.
      START_TIME:
        required: false
        type: string
        description: 'Optional start time (e.g. "2 hours ago", "2026-03-19", "2026-03-19 10:00"). UTC assumed. Mutually exclusive with START_VERSION.'
      END_TIME:
        required: false
        type: string
        description: 'Optional end time. Same formats as START_TIME. Mutually exclusive with END_VERSION.'
      DRY_RUN:
        required: false
        type: boolean
        description: If true, the workflow will not run replay verify.
        default: false
      FRAMEWORK_USAGE:
        required: false
        type: boolean
        description: Collect framework function usage instead of only replay-verifying.
        default: false
permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate mutually exclusive inputs
        env:
          START_VERSION: ${{ inputs.START_VERSION }}
          START_TIME: ${{ inputs.START_TIME }}
          END_VERSION: ${{ inputs.END_VERSION }}
          END_TIME: ${{ inputs.END_TIME }}
          FRAMEWORK_USAGE: ${{ inputs.FRAMEWORK_USAGE }}
        run: |
          if [ -n "$START_VERSION" ] && [ -n "$START_TIME" ]; then
            echo "::error::START_VERSION and START_TIME are mutually exclusive. Please specify only one."
            exit 1
          fi
          if [ -n "$END_VERSION" ] && [ -n "$END_TIME" ]; then
            echo "::error::END_VERSION and END_TIME are mutually exclusive. Please specify only one."
            exit 1
          fi
          if [ "$FRAMEWORK_USAGE" = "true" ]; then
            if [ -z "$START_VERSION" ] && [ -z "$START_TIME" ]; then
              echo "::error::A START_VERSION or START_TIME is required for framework usage collection."
              exit 1
            fi
            if [ -z "$END_VERSION" ] && [ -z "$END_TIME" ]; then
              echo "::error::An END_VERSION or END_TIME is required for framework usage collection."
              exit 1
            fi
          fi

  build-images:
    needs: validate-inputs
    permissions:
      contents: read
      id-token: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_DOCKER_ARTIFACT_REPO: ${{ secrets.AWS_DOCKER_ARTIFACT_REPO }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ENV_ECR_AWS_ACCOUNT_NUM: ${{ secrets.ENV_ECR_AWS_ACCOUNT_NUM }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
    uses: ./.github/workflows/workflow-run-docker-rust-build.yaml
    with:
      GIT_SHA: ${{ inputs.IMAGE_TAG || github.event.pull_request.head.sha || github.sha }}
      TARGET_CACHE_ID: ${{ github.event.number && format('pr-{0}', github.event.number) || github.ref_name }}
      PROFILE: performance
      DRY_RUN: ${{ inputs.DRY_RUN }}

  run-replay-verify:
    runs-on: 4cpu-gh-ubuntu24-x64
    timeout-minutes: 420 # 7 hours
    needs: build-images
    env:
      FRAMEWORK_USAGE_BUCKET: aptos-framework-usage-reports
      REPORT_BRANCH: gh-pages
      REPORT_REPOSITORY: aptos-labs/aptos-core-private
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Match forge.find_recent_images' 100-commit search window.
          # we can optionally use the IMAGE_TAG to find the exact commit to checkout
          fetch-depth: 100

      - uses: aptos-labs/aptos-core/.github/actions/docker-setup@main
        id: docker-setup
        with:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          EXPORT_GCP_PROJECT_VARIABLES: "false"
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
          GCP_AUTH_DURATION: "25200" # 7 hours

      # Authenticate to Google Cloud the project is aptos-ci with credentails files generated
      - name: Authenticate to Google Cloud
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          export_environment_variables: false
          create_credentials_file: true

      # This is required since we need to switch from aptos-ci to aptos-devinfra-0
      - name: Setup credentials  
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV 
          echo "GOOGLE_GHA_CREDS_PATH=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV
          echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> $GITHUB_ENV

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          install_components: "kubectl, gke-gcloud-auth-plugin"

      - name: "Setup GCloud project"
        shell: bash
        run: gcloud config set project aptos-devinfra-0

      - name: Verify private framework usage shard bucket
        if: ${{ inputs.DRY_RUN == false && inputs.FRAMEWORK_USAGE }}
        run: |
          PUBLIC_ACCESS_PREVENTION="$(gcloud storage buckets describe "gs://${FRAMEWORK_USAGE_BUCKET}" --format='value(public_access_prevention)')"
          UNIFORM_BUCKET_ACCESS="$(gcloud storage buckets describe "gs://${FRAMEWORK_USAGE_BUCKET}" --format='value(uniform_bucket_level_access)')"
          if [ "$PUBLIC_ACCESS_PREVENTION" != "enforced" ]; then
            echo "::error::Framework usage shard bucket must enforce public access prevention."
            exit 1
          fi
          if [ "$UNIFORM_BUCKET_ACCESS" != "true" ]; then
            echo "::error::Framework usage shard bucket must use uniform bucket-level access."
            exit 1
          fi

      - uses: ./.github/actions/python-setup
        with:
          pyproject_directory: testsuite/replay-verify

      - name: Schedule replay verify
        if: ${{ inputs.DRY_RUN == false }}
        env:
          GOOGLE_CLOUD_PROJECT: aptos-devinfra-0
          NETWORK: ${{ inputs.NETWORK }}
          START_VERSION: ${{ inputs.START_VERSION }}
          END_VERSION: ${{ inputs.END_VERSION }}
          START_TIME: ${{ inputs.START_TIME }}
          END_TIME: ${{ inputs.END_TIME }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
          FRAMEWORK_USAGE: ${{ inputs.FRAMEWORK_USAGE }}
        run: |
          cd testsuite/replay-verify
          ARGS=(--network "$NETWORK")
          if [ -n "$START_VERSION" ]; then
            ARGS+=(--start "$START_VERSION")
          fi
          if [ -n "$END_VERSION" ]; then
            ARGS+=(--end "$END_VERSION")
          fi
          if [ -n "$START_TIME" ]; then
            ARGS+=(--start-time "$START_TIME")
          fi
          if [ -n "$END_TIME" ]; then
            ARGS+=(--end-time "$END_TIME")
          fi
          if [ -n "$IMAGE_TAG" ]; then
            ARGS+=(--image_tag "$IMAGE_TAG")
          fi
          if [ "$FRAMEWORK_USAGE" = "true" ]; then
            ARGS+=(--framework-usage-output-dir ../../framework-usage-results)
            ARGS+=(--framework-usage-bucket "$FRAMEWORK_USAGE_BUCKET")
          fi
          ARGS+=(--image_profile performance)
          poetry run python main.py "${ARGS[@]}"
        timeout-minutes: 420 # 7 hours

      - name: Verify private framework usage Pages site
        if: ${{ inputs.DRY_RUN == false && inputs.FRAMEWORK_USAGE }}
        env:
          GH_TOKEN: ${{ secrets.APTOS_BOT_PAT }}
        run: |
          REPOSITORY_PRIVATE="$(gh api "repos/${REPORT_REPOSITORY}" --jq '.private')"
          PAGES_PUBLIC="$(gh api "repos/${REPORT_REPOSITORY}/pages" --jq '.public')"
          PAGES_BRANCH="$(gh api "repos/${REPORT_REPOSITORY}/pages" --jq '.source.branch')"

          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Refusing to publish framework usage data to a public repository."
            exit 1
          fi
          if [ "$PAGES_PUBLIC" != "false" ]; then
            echo "::error::Refusing to publish framework usage data to a public Pages site."
            exit 1
          fi
          if [ "$PAGES_BRANCH" != "$REPORT_BRANCH" ]; then
            echo "::error::Pages publishes from '${PAGES_BRANCH}', not the configured '${REPORT_BRANCH}' branch."
            exit 1
          fi

      - name: Checkout private framework usage Pages site
        if: ${{ inputs.DRY_RUN == false && inputs.FRAMEWORK_USAGE }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          repository: aptos-labs/aptos-core-private
          ref: gh-pages
          path: framework-usage-pages
          token: ${{ secrets.APTOS_BOT_PAT }}
          fetch-depth: 1

      - name: Publish framework usage reports
        if: ${{ inputs.DRY_RUN == false && inputs.FRAMEWORK_USAGE }}
        env:
          NETWORK: ${{ inputs.NETWORK }}
          GH_TOKEN: ${{ secrets.APTOS_BOT_PAT }}
        run: |
          REPORT_JSON="framework-usage-results/framework-usage.json"
          REPORT_HTML="framework-usage-results/framework-usage.html"
          REPORT_PREFIX="framework-usage/${NETWORK}/runs/${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}"
          REPORT_DIRECTORY="framework-usage-pages/${REPORT_PREFIX}"
          LATEST_REPORT_PREFIX="framework-usage/${NETWORK}"
          LATEST_REPORT_DIRECTORY="framework-usage-pages/${LATEST_REPORT_PREFIX}"
          install -D -m 0644 "$REPORT_HTML" "${REPORT_DIRECTORY}/index.html"
          install -D -m 0644 "$REPORT_JSON" "${REPORT_DIRECTORY}/framework-usage.json"
          install -D -m 0644 "$REPORT_HTML" "${LATEST_REPORT_DIRECTORY}/index.html"
          install -D -m 0644 "$REPORT_JSON" "${LATEST_REPORT_DIRECTORY}/framework-usage.json"

          git -C framework-usage-pages config user.name "aptos-bot[bot]"
          git -C framework-usage-pages config user.email "aptos-bot[bot]@users.noreply.github.com"
          git -C framework-usage-pages add -- "$REPORT_PREFIX" "${LATEST_REPORT_PREFIX}/index.html" "${LATEST_REPORT_PREFIX}/framework-usage.json"
          git -C framework-usage-pages commit -m "Publish framework usage report ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git -C framework-usage-pages pull --rebase origin "$REPORT_BRANCH" && git -C framework-usage-pages push origin "HEAD:${REPORT_BRANCH}"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Failed to publish the framework usage report after ${attempt} attempts."
              exit 1
            fi
            sleep "$attempt"
          done

          PAGES_URL="$(gh api "repos/${REPORT_REPOSITORY}/pages" --jq '.html_url')"
          HTML_REPORT_URL="${PAGES_URL%/}/${REPORT_PREFIX}/index.html"
          JSON_REPORT_URL="${PAGES_URL%/}/${REPORT_PREFIX}/framework-usage.json"
          LATEST_HTML_REPORT_URL="${PAGES_URL%/}/${LATEST_REPORT_PREFIX}/index.html"
          LATEST_JSON_REPORT_URL="${PAGES_URL%/}/${LATEST_REPORT_PREFIX}/framework-usage.json"

          START_VERSION="$(jq -r '.start_version' "$REPORT_JSON")"
          END_VERSION="$(jq -r '.end_version' "$REPORT_JSON")"
          TRANSACTION_COUNT="$(jq -r '.processed_transaction_count' "$REPORT_JSON")"
          START_TIMESTAMP_USECS="$(jq -r '.start_timestamp_usecs' "$REPORT_JSON")"
          END_TIMESTAMP_USECS="$(jq -r '.end_timestamp_usecs' "$REPORT_JSON")"
          START_TIMESTAMP="$(date --utc --date="@$((START_TIMESTAMP_USECS / 1000000))" '+%Y-%m-%d %H:%M:%S UTC')"
          END_TIMESTAMP="$(date --utc --date="@$((END_TIMESTAMP_USECS / 1000000))" '+%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## Framework function usage report"
            echo
            echo "### Reports"
            echo
            echo "- [Open interactive HTML report](${HTML_REPORT_URL})"
            echo "- [Open merged JSON report](${JSON_REPORT_URL})"
            echo "- [Open latest ${NETWORK} HTML report](${LATEST_HTML_REPORT_URL})"
            echo "- [Open latest ${NETWORK} JSON report](${LATEST_JSON_REPORT_URL})"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Network | ${NETWORK} |"
            echo "| Ledger versions | ${START_VERSION}&ndash;${END_VERSION} |"
            echo "| UTC range | ${START_TIMESTAMP}&ndash;${END_TIMESTAMP} |"
            echo "| Transactions processed | ${TRANSACTION_COUNT} |"
            echo "| Run attempt | ${GITHUB_RUN_ATTEMPT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Framework function usage report::HTML: ${HTML_REPORT_URL} | JSON: ${JSON_REPORT_URL}"

      # This is in case user manually cancel the step above, we still want to cleanup the resources
      - name: Post-run cleanup
        env:
          GOOGLE_CLOUD_PROJECT: aptos-devinfra-0
          NETWORK: ${{ inputs.NETWORK }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        if: ${{ always() && inputs.DRY_RUN == false }}
        run: |
          cd testsuite/replay-verify
          ARGS=(--network "$NETWORK" --cleanup)
          if [ -n "$IMAGE_TAG" ]; then
            ARGS+=(--image_tag "$IMAGE_TAG")
          fi
          poetry run python main.py "${ARGS[@]}"
          echo "Cleanup completed"
