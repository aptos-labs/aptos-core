name: "*run replay-verify on archive reusable workflow"

on:
  # This allows the workflow to be triggered from another workflow
  workflow_call:
    inputs:
      NETWORK:
        required: true
        type: string
        description: The network to run replay verify on.
      IMAGE_TAG:
        required: false
        type: string
        description: The image tag of the feature branch to test, if not specified, it will use the latest commit on current branch.
      START_VERSION:
        required: false
        type: string
        description: Optional version to start replaying. If not specified, replay-verify will determines start version itself.
      END_VERSION:
        required: false
        type: string
        description: Optional version to end replaying. If not specified, replay-verify will determines end version itself.
      START_TIME:
        required: false
        type: string
        description: 'Optional start time (e.g. "2 hours ago", "2026-03-19", "2026-03-19 10:00"). UTC assumed. Mutually exclusive with START_VERSION.'
      END_TIME:
        required: false
        type: string
        description: 'Optional end time. Same formats as START_TIME. Mutually exclusive with END_VERSION.'
      DRY_RUN:
        required: false
        type: boolean
        description: If true, the workflow will not run replay verify.
        default: false
      FRAMEWORK_USAGE:
        required: false
        type: boolean
        description: Collect framework function usage instead of only replay-verifying.
        default: false
      RESULTS_BUCKET:
        required: false
        type: string
        description: GCS bucket used for framework usage shards.
      REPORT_BUCKET:
        required: false
        type: string
        description: Public GCS bucket used to publish the rendered HTML report.

  workflow_dispatch:
    inputs:
      NETWORK:
        required: true
        type: string
        description: The network to run replay verify on.
      IMAGE_TAG:
        required: false
        type: string
        description: The image tag of the feature branch to test, if not specified, it will use the latest commit on current branch.
      START_VERSION:
        required: false
        type: string
        description: The history start to use for the backup. If not specified, it will use the default history start.
      END_VERSION:
        required: false
        type: string
        description: The end version to use for the backup. If not specified, it will use the latest version.
      START_TIME:
        required: false
        type: string
        description: 'Optional start time (e.g. "2 hours ago", "2026-03-19", "2026-03-19 10:00"). UTC assumed. Mutually exclusive with START_VERSION.'
      END_TIME:
        required: false
        type: string
        description: 'Optional end time. Same formats as START_TIME. Mutually exclusive with END_VERSION.'
      DRY_RUN:
        required: false
        type: boolean
        description: If true, the workflow will not run replay verify.
        default: false
      FRAMEWORK_USAGE:
        required: false
        type: boolean
        description: Collect framework function usage instead of only replay-verifying.
        default: false
      RESULTS_BUCKET:
        required: false
        type: string
        description: GCS bucket used for framework usage shards.
      REPORT_BUCKET:
        required: false
        type: string
        description: Public GCS bucket used to publish the rendered HTML report.
permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate mutually exclusive inputs
        env:
          START_VERSION: ${{ inputs.START_VERSION }}
          START_TIME: ${{ inputs.START_TIME }}
          END_VERSION: ${{ inputs.END_VERSION }}
          END_TIME: ${{ inputs.END_TIME }}
          FRAMEWORK_USAGE: ${{ inputs.FRAMEWORK_USAGE }}
          RESULTS_BUCKET: ${{ inputs.RESULTS_BUCKET }}
        run: |
          if [ -n "$START_VERSION" ] && [ -n "$START_TIME" ]; then
            echo "::error::START_VERSION and START_TIME are mutually exclusive. Please specify only one."
            exit 1
          fi
          if [ -n "$END_VERSION" ] && [ -n "$END_TIME" ]; then
            echo "::error::END_VERSION and END_TIME are mutually exclusive. Please specify only one."
            exit 1
          fi
          if [ "$FRAMEWORK_USAGE" = "true" ]; then
            if [ -z "$START_VERSION" ] && [ -z "$START_TIME" ]; then
              echo "::error::A START_VERSION or START_TIME is required for framework usage collection."
              exit 1
            fi
            if [ -z "$END_VERSION" ] && [ -z "$END_TIME" ]; then
              echo "::error::An END_VERSION or END_TIME is required for framework usage collection."
              exit 1
            fi
          fi

  build-images:
    needs: validate-inputs
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: aptos-labs/aptos-core/.github/workflows/workflow-run-docker-rust-build.yaml@main
    with:
      GIT_SHA: ${{ inputs.IMAGE_TAG || github.event.pull_request.head.sha || github.sha }}
      TARGET_CACHE_ID: ${{ github.event.number && format('pr-{0}', github.event.number) || github.ref_name }}
      PROFILE: performance
      DRY_RUN: ${{ inputs.DRY_RUN }}

  run-replay-verify:
    runs-on: 4cpu-gh-ubuntu24-x64
    timeout-minutes: 420 # 7 hours
    needs: build-images
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # Match forge.find_recent_images' 100-commit search window.
          # we can optionally use the IMAGE_TAG to find the exact commit to checkout
          fetch-depth: 100

      - uses: aptos-labs/aptos-core/.github/actions/docker-setup@main
        id: docker-setup
        with:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          EXPORT_GCP_PROJECT_VARIABLES: "false"
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
          GCP_AUTH_DURATION: "25200" # 7 hours

      # Authenticate to Google Cloud the project is aptos-ci with credentails files generated
      - name: Authenticate to Google Cloud
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          export_environment_variables: false
          create_credentials_file: true

      # This is required since we need to switch from aptos-ci to aptos-devinfra-0
      - name: Setup credentials  
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV 
          echo "GOOGLE_GHA_CREDS_PATH=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV
          echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> $GITHUB_ENV

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          install_components: "kubectl, gke-gcloud-auth-plugin"

      - name: "Setup GCloud project"
        shell: bash
        run: gcloud config set project aptos-devinfra-0

      - uses: ./.github/actions/python-setup
        with:
          pyproject_directory: testsuite/replay-verify

      - name: Schedule replay verify
        if: ${{ inputs.DRY_RUN == false }}
        env:
          GOOGLE_CLOUD_PROJECT: aptos-devinfra-0
          NETWORK: ${{ inputs.NETWORK }}
          START_VERSION: ${{ inputs.START_VERSION }}
          END_VERSION: ${{ inputs.END_VERSION }}
          START_TIME: ${{ inputs.START_TIME }}
          END_TIME: ${{ inputs.END_TIME }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
          FRAMEWORK_USAGE: ${{ inputs.FRAMEWORK_USAGE }}
          RESULTS_BUCKET: ${{ inputs.RESULTS_BUCKET }}
        run: |
          cd testsuite/replay-verify
          ARGS=(--network "$NETWORK")
          if [ -n "$START_VERSION" ]; then
            ARGS+=(--start "$START_VERSION")
          fi
          if [ -n "$END_VERSION" ]; then
            ARGS+=(--end "$END_VERSION")
          fi
          if [ -n "$START_TIME" ]; then
            ARGS+=(--start-time "$START_TIME")
          fi
          if [ -n "$END_TIME" ]; then
            ARGS+=(--end-time "$END_TIME")
          fi
          if [ -n "$IMAGE_TAG" ]; then
            ARGS+=(--image_tag "$IMAGE_TAG")
          fi
          if [ "$FRAMEWORK_USAGE" = "true" ]; then
            ARGS+=(--framework-usage-output-dir ../../framework-usage-results)
            if [ -n "$RESULTS_BUCKET" ]; then
              ARGS+=(--framework-usage-bucket "$RESULTS_BUCKET")
            fi
          fi
          ARGS+=(--image_profile performance)
          poetry run python main.py "${ARGS[@]}"
        timeout-minutes: 420 # 7 hours

      - name: Upload framework usage report
        if: ${{ inputs.DRY_RUN == false && inputs.FRAMEWORK_USAGE }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin@v4.6.2
        with:
          name: framework-usage-${{ inputs.NETWORK }}-${{ github.run_id }}
          path: framework-usage-results/
          if-no-files-found: error

      - name: Publish framework usage reports
        if: ${{ inputs.DRY_RUN == false && inputs.FRAMEWORK_USAGE && inputs.REPORT_BUCKET != '' }}
        env:
          NETWORK: ${{ inputs.NETWORK }}
          REPORT_BUCKET: ${{ inputs.REPORT_BUCKET }}
        run: |
          REPORT_JSON="framework-usage-results/framework-usage.json"
          REPORT_HTML="framework-usage-results/framework-usage.html"
          REPORT_PREFIX="framework-usage/${NETWORK}/runs/${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}"
          HTML_OBJECT_PATH="${REPORT_PREFIX}/index.html"
          JSON_OBJECT_PATH="${REPORT_PREFIX}/framework-usage.json"
          HTML_REPORT_URL="https://storage.googleapis.com/${REPORT_BUCKET}/${HTML_OBJECT_PATH}"
          JSON_REPORT_URL="https://storage.googleapis.com/${REPORT_BUCKET}/${JSON_OBJECT_PATH}"

          gcloud storage cp "$REPORT_HTML" "gs://${REPORT_BUCKET}/${HTML_OBJECT_PATH}" \
            --content-type="text/html; charset=utf-8" \
            --content-disposition=inline \
            --cache-control="public,max-age=31536000,immutable"
          gcloud storage cp "$REPORT_JSON" "gs://${REPORT_BUCKET}/${JSON_OBJECT_PATH}" \
            --content-type="application/json" \
            --content-disposition=inline \
            --cache-control="public,max-age=31536000,immutable"

          START_VERSION="$(jq -r '.start_version' "$REPORT_JSON")"
          END_VERSION="$(jq -r '.end_version' "$REPORT_JSON")"
          TRANSACTION_COUNT="$(jq -r '.processed_transaction_count' "$REPORT_JSON")"
          START_TIMESTAMP_USECS="$(jq -r '.start_timestamp_usecs' "$REPORT_JSON")"
          END_TIMESTAMP_USECS="$(jq -r '.end_timestamp_usecs' "$REPORT_JSON")"
          START_TIMESTAMP="$(date --utc --date="@$((START_TIMESTAMP_USECS / 1000000))" '+%Y-%m-%d %H:%M:%S UTC')"
          END_TIMESTAMP="$(date --utc --date="@$((END_TIMESTAMP_USECS / 1000000))" '+%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## Framework function usage report"
            echo
            echo "### Reports"
            echo
            echo "- [Open interactive HTML report](${HTML_REPORT_URL})"
            echo "- [Open merged JSON report](${JSON_REPORT_URL})"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Network | ${NETWORK} |"
            echo "| Ledger versions | ${START_VERSION}&ndash;${END_VERSION} |"
            echo "| UTC range | ${START_TIMESTAMP}&ndash;${END_TIMESTAMP} |"
            echo "| Transactions processed | ${TRANSACTION_COUNT} |"
            echo "| Run attempt | ${GITHUB_RUN_ATTEMPT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Framework function usage report::HTML: ${HTML_REPORT_URL} | JSON: ${JSON_REPORT_URL}"

      # This is in case user manually cancel the step above, we still want to cleanup the resources
      - name: Post-run cleanup
        env:
          GOOGLE_CLOUD_PROJECT: aptos-devinfra-0
          NETWORK: ${{ inputs.NETWORK }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        if: ${{ always() && inputs.DRY_RUN == false }}
        run: |
          cd testsuite/replay-verify
          ARGS=(--network "$NETWORK" --cleanup)
          if [ -n "$IMAGE_TAG" ]; then
            ARGS+=(--image_tag "$IMAGE_TAG")
          fi
          poetry run python main.py "${ARGS[@]}"
          echo "Cleanup completed"
