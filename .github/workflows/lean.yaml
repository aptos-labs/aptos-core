name: Lean

on:
  pull_request:
    paths:
      - ".github/workflows/lean.yaml"
      - "aptos-move/cli/**"
      - "scripts/dev_setup.sh"
      - "third_party/move/lean/**"
      - "third_party/move/move-compiler-v2/**"
      - "third_party/move/move-model/bytecode/**"
      - "third_party/move/move-model/exchange/**"
      - "third_party/move/tools/move-asm/**"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lean.yaml"
      - "aptos-move/cli/**"
      - "scripts/dev_setup.sh"
      - "third_party/move/lean/**"
      - "third_party/move/move-compiler-v2/**"
      - "third_party/move/move-model/bytecode/**"
      - "third_party/move/move-model/exchange/**"
      - "third_party/move/tools/move-asm/**"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: runs-on,cpu=32,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: scripts/dev_setup.sh -b -p -l -k

      - name: Build the frontend CLI
        run: cargo build --locked -p aptos --bin aptos

      - name: Build Lean core and examples
        working-directory: third_party/move/lean
        env:
          APTOS_CLI: ${{ github.workspace }}/target/debug/aptos
        run: |
          source "$HOME/.profile"
          lake build MoveModel
          lake build Examples

      - name: Run Lean tests
        working-directory: third_party/move/lean
        env:
          APTOS_CLI: ${{ github.workspace }}/target/debug/aptos
        run: |
          source "$HOME/.profile"
          lake test
