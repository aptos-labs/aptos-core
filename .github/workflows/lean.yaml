name: Lean

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      GIT_SHA:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-selection:
    uses: ./.github/workflows/e2e-test-selection.yaml
    with:
      ARTIFACT_NAME: lean
      GIT_SHA: ${{ inputs.GIT_SHA || github.event.pull_request.head.sha || github.sha }}
      FORCE_FULL: ${{ inputs.GIT_SHA != '' }}

  build-and-test:
    needs: e2e-selection
    # A pre-rollout trusted registry cannot select Lean yet; run it in full.
    if: (!contains(fromJSON(needs.e2e-selection.outputs.known_e2e_tests || '[]'), 'lean') || contains(fromJSON(needs.e2e-selection.outputs.selected_e2e_tests || '[]'), 'lean'))
    runs-on: runs-on,cpu=32,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.GIT_SHA || github.event.pull_request.head.sha || github.sha }}

      - name: Install Lean toolchain
        run: |
          scripts/dev_setup.sh -b -p -l -k
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Build the standalone exchange frontend
        run: cargo build --locked --profile ci -p aptos-move-cli --features binary --bin move

      - name: Install the Rust exporter's pinned toolchain
        # The Lean suites build the exporter from several modules at once; a
        # first use of its pinned nightly would install it from each build,
        # and concurrent rustup installs of one toolchain collide.
        working-directory: third_party/move/lean/leaner-rust/rust-exporter
        run: cargo --version

      - name: Test LeanerIR
        working-directory: third_party/move/lean/leaner-ir
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test Leaner Move profile
        working-directory: third_party/move/lean/leaner-move
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test Leaner Rust profile
        working-directory: third_party/move/lean/leaner-rust
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test end-to-end baselines
        working-directory: third_party/move/lean/leaner-e2e-tests
        # The driver manages its own ci-profile exchange frontend; the build
        # step above just gives cargo failures their own step.
        run: |
          source "$HOME/.profile"
          lake test

      - name: Build the verification benchmark
        # Run nightly by leaner-bench.yaml; built here so a change breaking
        # it shows on the pull request.
        working-directory: third_party/move/lean/leaner-e2e-tests
        run: |
          source "$HOME/.profile"
          lake build leaner-bench

      - name: Test compiler-v2 Lean integration
        # compiler-v2 elaborates `.lean` sources in leaner-move, which the
        # Leaner Move step above has built.
        run: |
          cargo test --locked -p move-compiler-v2 leaner::tests
          cargo test --locked -p move-compiler-v2-transactional-tests \
            --test tests -- leaner/

  result:
    name: Lean integration result
    if: always()
    needs: [e2e-selection, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check selection and execution
        env:
          SELECTION_RESULT: ${{ needs.e2e-selection.result }}
          SELECTED: ${{ (!contains(fromJSON(needs.e2e-selection.outputs.known_e2e_tests || '[]'), 'lean') || contains(fromJSON(needs.e2e-selection.outputs.selected_e2e_tests || '[]'), 'lean')) }}
          TEST_RESULT: ${{ needs.build-and-test.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$SELECTED" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
          fi
