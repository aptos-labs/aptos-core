name: Lean

on:
  pull_request:
    paths:
      - ".github/workflows/lean.yaml"
      - "aptos-move/cli/**"
      - "scripts/dev_setup.sh"
      - "third_party/move/lean/**"
      - "third_party/move/move-compiler-v2/**"
      - "third_party/move/move-model/bytecode/**"
      - "third_party/move/move-model/exchange/**"
      - "third_party/move/tools/move-asm/**"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lean.yaml"
      - "aptos-move/cli/**"
      - "scripts/dev_setup.sh"
      - "third_party/move/lean/**"
      - "third_party/move/move-compiler-v2/**"
      - "third_party/move/move-model/bytecode/**"
      - "third_party/move/move-model/exchange/**"
      - "third_party/move/tools/move-asm/**"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Lean CI is disabled while the verification design is rebuilt.
    # Skip the entire job, including toolchain setup and Rust integration tests.
    if: ${{ false }}
    runs-on: runs-on,cpu=32,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Lean toolchain
        run: |
          scripts/dev_setup.sh -b -p -l -k
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Build the standalone exchange frontend
        run: cargo build --locked --profile ci -p aptos-move-cli --features binary --bin move

      - name: Test LeanerIR
        working-directory: third_party/move/lean/leaner-ir
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test Leaner Move profile
        working-directory: third_party/move/lean/leaner-move
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test Leaner Rust profile
        working-directory: third_party/move/lean/leaner-rust
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test end-to-end baselines
        working-directory: third_party/move/lean/leaner-e2e-tests
        # The driver manages its own ci-profile exchange frontend; the build
        # step above just gives cargo failures their own step.
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test compiler-v2 Lean integration
        run: |
          cargo test --locked -p move-compiler-v2 leaner::tests
          cargo test --locked -p move-compiler-v2-transactional-tests \
            --test tests -- leaner/
