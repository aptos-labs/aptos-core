name: Lean

on:
  pull_request:
    paths:
      - ".github/workflows/lean.yaml"
      - "aptos-move/cli/**"
      - "scripts/dev_setup.sh"
      - "third_party/move/lean/**"
      - "third_party/move/move-compiler-v2/**"
      - "third_party/move/move-model/bytecode/**"
      - "third_party/move/move-model/exchange/**"
      - "third_party/move/tools/move-asm/**"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lean.yaml"
      - "aptos-move/cli/**"
      - "scripts/dev_setup.sh"
      - "third_party/move/lean/**"
      - "third_party/move/move-compiler-v2/**"
      - "third_party/move/move-model/bytecode/**"
      - "third_party/move/move-model/exchange/**"
      - "third_party/move/tools/move-asm/**"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: runs-on,cpu=32,family=c7,disk=large,image=aptos-ubuntu-x64,run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          scripts/dev_setup.sh -b -p -l -k
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Build the lightweight exchange frontend
        run: cargo build --locked -p aptos-move-cli --bin aptos-move-exchange

      - name: Build MoveModel frontend
        working-directory: third_party/move/lean/move-model
        run: |
          source "$HOME/.profile"
          lake build MoveModel.Frontend.Elab

      - name: Build Leaner Move
        working-directory: third_party/move/lean/move
        run: |
          source "$HOME/.profile"
          lake build

      - name: Test MoveModel
        working-directory: third_party/move/lean/move-model
        env:
          APTOS_MOVE_EXCHANGE: ${{ github.workspace }}/target/debug/aptos-move-exchange
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test Leaner Move
        working-directory: third_party/move/lean/move
        env:
          APTOS_MOVE_EXCHANGE: ${{ github.workspace }}/target/debug/aptos-move-exchange
        run: |
          source "$HOME/.profile"
          lake test

      - name: Test compiler-v2 Lean integration
        run: |
          cargo test --locked -p move-compiler-v2 leaner::tests
          cargo test --locked -p move-compiler-v2-transactional-tests \
            --test tests -- leaner/
