name: CI artifact failure contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  missing-artifact:
    runs-on: 2cpu-gh-ubuntu24-x64
    steps:
      - name: Exercise a missing artifact
        id: missing-artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "0"
      - name: Require missing-artifact failure
        env:
          OUTCOME: ${{ steps.missing-artifact.outcome }}
        run: test "$OUTCOME" = failure
