name: CI validation measurements
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  image-pins:
    runs-on: 2cpu-gh-ubuntu24-x64
    outputs:
      digests: ${{ steps.resolve.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6de07db2c04bdd975e13f2e33003458c15dc32f6
      - uses: aptos-labs/aptos-core/.github/actions/docker-setup@6de07db2c04bdd975e13f2e33003458c15dc32f6
        with:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DOCKER_ARTIFACT_REPO: ${{ secrets.AWS_DOCKER_ARTIFACT_REPO }}
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
      - id: resolve
        name: Resolve immutable image digests once for all samples
        env:
          IMAGE_REPO: ${{ vars.GCP_DOCKER_ARTIFACT_REPO }}
        run: |
          set -euo pipefail
          digests='{}'
          for tag in aba7ebe8287390be4768c5845d7022b5ccdec512 devnet testnet mainnet; do
            digest=$(docker buildx imagetools inspect "$IMAGE_REPO/tools:$tag" --format '{{json .Manifest}}' | jq -er '.digest')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            digests=$(jq -c --arg tag "$tag" --arg digest "$digest" '. + {($tag): $digest}' <<< "$digests")
          done
          echo "$digests"
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  cli-baseline:
    needs: image-pins
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    uses: ./.github/workflows/validation-cli-baseline.yaml
    secrets: inherit
    with:
      GIT_SHA: 6de07db2c04bdd975e13f2e33003458c15dc32f6
      image-digests: ${{ needs.image-pins.outputs.digests }}

  cli-candidate:
    needs: image-pins
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    uses: ./.github/workflows/validation-cli-candidate.yaml
    secrets: inherit
    with:
      GIT_SHA: 6de07db2c04bdd975e13f2e33003458c15dc32f6
      image-digests: ${{ needs.image-pins.outputs.digests }}

  api-baseline:
    needs: image-pins
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    uses: ./.github/workflows/validation-api-baseline.yaml
    secrets: inherit
    with:
      GIT_SHA: 6de07db2c04bdd975e13f2e33003458c15dc32f6
      image-digests: ${{ needs.image-pins.outputs.digests }}

  api-candidate:
    needs: image-pins
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    uses: ./.github/workflows/validation-api-candidate.yaml
    secrets: inherit
    with:
      GIT_SHA: 6de07db2c04bdd975e13f2e33003458c15dc32f6
      image-digests: ${{ needs.image-pins.outputs.digests }}
