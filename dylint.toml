# Configuration for the custom lints in devtools/lints (run with
# `cargo dylint --all`). Each lint is scoped to crate names; a lint not
# naming a crate does nothing there.
#
# This file must stay at the workspace root: dylint reads `dylint.toml` from
# the root of the workspace being linted (like `clippy.toml`), not from the
# lint library's directory.

[aptos_lints.no_std_hash_map]
# Consensus-critical: anything that executes a transaction.
crates = ["mono-move-*", "specializer"]
# Tooling: order-dependence cannot affect a committed result.
exempt = [
    "mono-move-testsuite",
    "mono-move-replay-benchmark",
    "mono-move-lean-link",
    "vm-comparison",
]

[aptos_lints.raw_memory_access]
# Every VM crate: raw memory access goes through mono_move_mem::MemAddr.
crates = ["mono-move-*", "specializer"]
exempt = [
    "mono-move-mem",       # the choke point itself
    "mono-move-alloc",     # the allocator that hands out the memory
    "mono-move-lean-link", # C ABI buffers for the Lean harness
]
