# Configuration for the custom lints in devtools/lints (run with
# `cargo dylint --all`). Each lint is scoped to crate names; a lint not
# naming a crate does nothing there.
#
# This file must stay at the workspace root: dylint reads `dylint.toml` from
# the root of the workspace being linted (like `clippy.toml`), not from the
# lint library's directory.

[aptos_lints.no_std_hash_map]
# Consensus-critical: anything that executes a transaction.
crates = ["mono-move-*", "specializer"]
# Tooling: order-dependence cannot affect a committed result.
exempt = [
    "mono-move-testsuite",
    "mono-move-replay",
    "mono-move-replay-benchmark",
    "mono-move-replay-common",
    "mono-move-unit-test-backend",
    "mono-move-lean-link",
    "vm-comparison",
]

[aptos_lints.unsafe_cell_reborrow]
# Opt-in: the structs whose `&self` methods reborrow through `UnsafeCell`
# fields under the discipline in devtools/lints/docs/unsafe_cell_reborrow.md.
# Nothing else is checked; adding a struct here is a deliberate decision.
structs = [
    "mono_move_runtime::native_context::ProductionNativeContext",
    "mono_move_runtime::interpreter::LoaderAdapter",
    "mono_move_core::root_pool::RootPool",
]
# Every borrow of a cell goes through `borrow_cell!`, which ties it to a local
# anchor with this function, so that the compiler stops it from leaving the
# function that made it.
anchor_fns = ["mono_move_core::cell::anchor_borrow"]
crates = ["mono-move-*"]
