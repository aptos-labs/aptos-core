# TODO: identify if we can move away from using pre-commit hooks for these checks.
#
# See also:
#  - https://pre-commit.com for more information.
#  - https://pre-commit.com/hooks.html for more hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: \.(rs|move)$
      - id: end-of-file-fixer
        files: \.(rs|move)$
      - id: check-added-large-files
        args:
          - --maxkb=2000
  - repo: https://github.com/aptos-labs/pre-commit-hooks
    rev: a30f0d816e5062a67d87c8de753cfe499672b959 # Fix the revision to the v1.5.5 release commit. See: https://github.com/Lucas-C/pre-commit-hooks/releases/tag/v1.5.5
    hooks:
      - id: insert-license
        files: ^(?!third_party/).*\.rs$
        args:
          - --license-filepath
          - devtools/assets/innovation_license_header.txt
          - --comment-style
          - //
      - id: insert-license
        files: ^third_party/move/mono-move/.*\.rs$
        args:
          - --license-filepath
          - devtools/assets/innovation_license_header.txt
          - --comment-style
          - //
      - id: insert-license
        files: ^(?=third_party/)(?!third_party/move/mono-move/)(?!third_party/move/lean/).*\.rs$
        args:
          - --license-filepath
          - devtools/assets/innovation_license_header.txt
          - --license-filepath
          - devtools/assets/third_party_license_header.txt
          - --comment-style
          - //
      # The Lean tree carries the Apache or the Innovation-Enabling header. The
      # deprecated v0 packages and generated `.exp.lean` baselines are exempt.
      - id: insert-license
        files: ^third_party/move/lean/(?!v0/).*\.rs$
        args:
          - --license-filepath
          - devtools/assets/apache_license_header.txt
          - --license-filepath
          - devtools/assets/innovation_license_header.txt
          - --comment-style
          - //
      - id: insert-license
        files: ^third_party/move/lean/(?!v0/).*(?<!\.exp)\.lean$
        args:
          - --license-filepath
          - devtools/assets/apache_license_header.txt
          - --license-filepath
          - devtools/assets/innovation_license_header.txt
          # NOTE: the value must not be a bare `--`: argparse in Python 3.10
          # strips a standalone `--` from an option's values, which leaves the
          # hook with an empty list for `--comment-style`. The `<start>|<prefix>|<end>`
          # triplet with empty start/end yields the same `-- ` prefix safely.
          - --comment-style=|--|
