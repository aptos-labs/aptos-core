proposals:
  - name: step_1_enable_epoch_timeout
    metadata:
      title: "Enable Epoch Timeout with a 1-Hour Grace Period"
      description: "Enable the epoch timeout watchdog with a 3600-second (1-hour) grace period from the start of reconfiguration. Once active, it allows an in-progress epoch transition to finish even if ordinary DKG or Chunky DKG remains incomplete. The setting takes effect at the next epoch transition and cannot by itself recover an already-stalled transition."
