---
# Enables function value features on testnet for the v1.50 release.
name: "v1.50-enable-function-value-features"
metadata:
  title: "Enable function reflection, function value dispatch, lazy module initialization, and function type ability checks"
  description: "Enables ENABLE_FUNCTION_REFLECTION (105), FUNCTION_VALUE_DISPATCH (125), LAZY_MODULE_INITIALIZATION (127), and CHECK_FUNCTION_TYPE_ABILITIES (129)."
update_sequence:
  - FeatureFlag:
      enabled:
        - enable_function_reflection
        - function_value_dispatch
        - lazy_module_initialization
        - check_function_type_abilities
